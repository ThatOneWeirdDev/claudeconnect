<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>try{var t=JSON.parse(localStorage.getItem("gql.theme"));if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>__SITE_NAME__</title>
<link rel="icon" href="/favicon">
<style>
/* Colours, type and radii follow OpenAI's published ChatGPT design tokens (@openai/apps-sdk-ui): neutral grays, a near-black
   solid button in light and near-white in dark, the system font, and 24px composer / 12px menu radii. */
:root{
  --surface:#ffffff;--surface-2:#f9f9f9;--surface-3:#f3f3f3;--elevated:#ffffff;
  --text:#0d0d0d;--text-2:#5d5d5d;--text-3:#8f8f8f;
  --border:rgba(13,13,13,.08);--border-2:rgba(13,13,13,.15);
  --hover:rgba(13,13,13,.06);--select:rgba(13,13,13,.09);
  --solid:#0d0d0d;--solid-ink:#ffffff;--solid-hover:#303030;
  --link:#0169cc;--focus:#0285ff;
  --danger:#e02e2a;--danger-soft:rgba(224,46,42,.08);--warn:#b9480d;--warn-soft:rgba(226,85,7,.1);--ok:#008635;
  --user:#f3f3f3;--code:#f9f9f9;--code-head:#f3f3f3;
  --shadow:0 12px 40px rgba(0,0,0,.14),0 0 0 1px rgba(13,13,13,.06);
  --shadow-s:0 2px 12px rgba(0,0,0,.08);
  --hl-k:#7C3AED;--hl-s:#0B7A55;--hl-n:#B45309;--hl-c:#8A94A6;--hl-t:#1D4ED8;
  --mono:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Monaco,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:#212121;--surface-2:#181818;--surface-3:#2a2a2a;--elevated:#303030;
    --text:#ececec;--text-2:#afafaf;--text-3:#8f8f8f;
    --border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.17);
    --hover:rgba(255,255,255,.08);--select:rgba(255,255,255,.12);
    --solid:#ffffff;--solid-ink:#0d0d0d;--solid-hover:#e3e3e3;
    --link:#339cff;--focus:#339cff;
    --danger:#ff6764;--danger-soft:rgba(255,103,100,.12);--warn:#ff8549;--warn-soft:rgba(255,133,73,.14);--ok:#40c977;
    --user:#303030;--code:#181818;--code-head:#2b2b2b;
    --shadow:0 12px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);
    --shadow-s:0 2px 12px rgba(0,0,0,.35);
    --hl-k:#C4A5FF;--hl-s:#6FD3A8;--hl-n:#F3B562;--hl-c:#6B7689;--hl-t:#8FB4FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface:#212121;--surface-2:#181818;--surface-3:#2a2a2a;--elevated:#303030;
  --text:#ececec;--text-2:#afafaf;--text-3:#8f8f8f;
  --border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.17);
  --hover:rgba(255,255,255,.08);--select:rgba(255,255,255,.12);
  --solid:#ffffff;--solid-ink:#0d0d0d;--solid-hover:#e3e3e3;
  --link:#339cff;--focus:#339cff;
  --danger:#ff6764;--danger-soft:rgba(255,103,100,.12);--warn:#ff8549;--warn-soft:rgba(255,133,73,.14);--ok:#40c977;
  --user:#303030;--code:#181818;--code-head:#2b2b2b;
  --shadow:0 12px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);
  --shadow-s:0 2px 12px rgba(0,0,0,.35);
  --hl-k:#C4A5FF;--hl-s:#6FD3A8;--hl-n:#F3B562;--hl-c:#6B7689;--hl-t:#8FB4FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--text);font-family:ui-sans-serif,-apple-system,system-ui,"Segoe UI","Noto Sans",Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
svg{display:block}
.m-bg{fill:var(--text)}.m-fg{stroke:var(--surface)}

/* ---- layout */
.app{--side-w:260px;--panel-w:0px;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--panel-w);height:100vh;height:100dvh}
/* collapsed, the sidebar is a rail of icons, like ChatGPT's: the logo (which opens it again), new chat, search, and you */
@media (min-width:861px){
  .app.side-collapsed{--side-w:52px}
  .app.side-collapsed .side-top{height:auto;padding:10px 8px 6px;justify-content:center}
  .app.side-collapsed #hideSide,.app.side-collapsed .history-label,.app.side-collapsed .history,.app.side-collapsed .nav-item span,.app.side-collapsed .nav-item input,.app.side-collapsed .who{display:none}
  .app.side-collapsed .brand{padding:5px;cursor:e-resize}
  .app.side-collapsed .side-nav{padding:0 8px;align-items:center}
  .app.side-collapsed .nav-item{width:36px;justify-content:center;padding:0}
  .app.side-collapsed .side-foot{margin-top:auto;border-top:0;padding:8px 6px}
  .app.side-collapsed .profile{padding:4px;justify-content:center}
  .app.side-collapsed .pmenu{right:auto;width:280px}
}
.app.panel-open{--panel-w:min(50vw,860px)}
.side{grid-column:1;background:var(--surface-2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;min-height:0}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px 12px;height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:var(--text);font-weight:600;font-size:15px;padding:4px 6px;border-radius:10px}
.brand:hover{background:var(--hover)}
.brand svg,.brand img{width:26px;height:26px;flex:none;border-radius:7px;object-fit:contain}
.brand span{display:none}
.top-title{font-size:18px;font-weight:500;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--text)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn svg{width:20px;height:20px}
.side-nav{padding:0 8px;display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:10px;font-size:14px;color:var(--text);text-align:left;width:100%}
.nav-item:hover,.nav-item:focus-within{background:var(--hover)}
.nav-item svg{width:18px;height:18px;flex:none;color:var(--text-2)}
.nav-item input{flex:1;min-width:0;border:0;background:none;outline:none;padding:0;height:100%}
.nav-item input::placeholder{color:var(--text)}
.nav-item input:focus::placeholder{color:var(--text-3)}
.history-label{padding:18px 18px 6px;font-size:12px;font-weight:600;color:var(--text-3)}
.history{flex:1;overflow-y:auto;padding:0 8px 10px;min-height:0}
.item{position:relative;display:flex;align-items:center;border-radius:10px}
.item a{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;color:var(--text);text-decoration:none;border-radius:10px;font-size:14px}
.item a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item a.sub{height:auto;min-height:48px;padding-top:6px;padding-bottom:6px}
.item a .tt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.item a .tt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-3);font-size:12px}
.opening{display:flex;align-items:center;justify-content:center;gap:10px;padding:56px 0;color:var(--text-3);font-size:14px}
.item:hover,.item.on{background:var(--hover)}
.item.on{background:var(--select)}
.item .more{opacity:0;width:28px;height:28px;margin-right:4px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);flex:none}
.item:hover .more,.item.on .more,.item .more[aria-expanded="true"]{opacity:1}
.item .more:hover{background:var(--hover);color:var(--text)}
.item .more svg{width:16px;height:16px}
.item .live{width:7px;height:7px;border-radius:50%;background:var(--text);flex:none;animation:pulse 1.4s ease-in-out infinite}
.item input{flex:1;margin:3px 4px;padding:5px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);outline:none}
.empty-list{padding:14px 12px;color:var(--text-3);font-size:13px}
.side-foot{padding:8px;border-top:1px solid var(--border);position:relative}
.profile{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:12px;text-align:left}
.profile:hover,.profile[aria-expanded="true"]{background:var(--hover)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--solid);color:var(--solid-ink);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;text-transform:uppercase}
.who{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.who b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:#2f9e5a;flex:none}
.dot.off{background:var(--text-3)}
.dot.warn{background:var(--warn)}
.scrim{display:none}
.main{grid-column:2;display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;height:100dvh;position:relative}
.top{flex:none;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px}
.top .grow{flex:1}
.only-narrow{display:none}

/* ---- menus, and the bar under the message box */
.menu,.pmenu,.pop{background:var(--elevated);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.pop{position:fixed;z-index:70;width:340px;max-width:calc(100vw - 16px);padding:8px;overflow-y:auto;animation:pop .12s ease-out}
#ctxMenu{width:290px}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.c-right,.c-modes{display:flex;align-items:center;gap:2px;min-width:0}
.c-modes{gap:6px;margin-left:6px}
.c-right{margin-left:auto}
.c-btn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 8px 0 11px;border-radius:999px;font-size:14px;font-weight:500;color:var(--text-2);white-space:nowrap}
.c-btn:hover,.c-btn[aria-expanded="true"]{background:var(--hover);color:var(--text)}
.c-btn .chev{width:14px;height:14px;color:var(--text-3)}
.modes{display:inline-flex;gap:1px;padding:2px;border-radius:999px;background:var(--surface-3)}
.modes button{height:30px;padding:0 12px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--text-2);white-space:nowrap}
.modes button.on{background:var(--elevated);color:var(--text);box-shadow:0 0 0 1px var(--border),var(--shadow-s)}
.ring{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--text-2);flex:none}
.ring:hover,.ring[aria-expanded="true"]{background:var(--hover)}
.ring svg{width:22px;height:22px;transform:rotate(-90deg)}
.ring .trk{stroke:var(--border-2)}
.ring .bar{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .35s}
.ring.mid{color:var(--warn)}
.ring.high{color:var(--danger)}
.ctx-pop{padding:10px 12px 8px}
.ctx-pop b{font-weight:600;font-size:14px}
.ctx-meter{height:6px;border-radius:999px;background:var(--border-2);margin:10px 0 8px;overflow:hidden}
.ctx-meter i{display:block;height:100%;border-radius:inherit;background:var(--text)}
.ctx-pop p{margin:0;font-size:13px;color:var(--text-2)}
.ctx-pop p.fine{margin-top:8px;font-size:12.5px;color:var(--text-3)}
.pm{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1px 10px;width:100%;padding:10px 12px;border-radius:10px;text-align:left}
.pm:hover{background:var(--hover)}
.pm b{font-weight:500;font-size:15px}
.pm small{grid-column:1;color:var(--text-3);font-size:13px}
.pm .tag{grid-column:1;justify-self:start;margin-top:4px;font-size:11.5px;color:var(--warn);background:var(--warn-soft);padding:1px 8px;border-radius:999px}
.pm .tick{grid-row:1/span 3;grid-column:2;width:18px;height:18px;color:var(--text);visibility:hidden}
.pm.on .tick{visibility:visible}
.effort{padding:10px 10px 6px}
.effort-head{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.effort-head b{font-weight:500}
.effort-head small{color:var(--text-3);font-size:12.5px}
.stairs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end}
.step{display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 2px 6px;border-radius:10px}
.step:hover{background:var(--hover)}
.step .bar{width:24px;border-radius:6px;background:var(--border-2);transition:background .15s}
.step:nth-child(1) .bar{height:10px}.step:nth-child(2) .bar{height:18px}.step:nth-child(3) .bar{height:26px}.step:nth-child(4) .bar{height:34px}.step:nth-child(5) .bar{height:42px}
.step.f .bar{background:color-mix(in srgb,var(--text) 35%,var(--border-2))}
.step.on .bar{background:var(--text)}
.step span{font-size:12px;color:var(--text-2);white-space:nowrap}
.step.on span{color:var(--text);font-weight:600}
.pick-note{display:flex;gap:9px;margin:4px 4px 4px;padding:10px 12px;border-radius:12px;background:var(--surface-3);color:var(--text-2);font-size:12.5px;line-height:1.45}
.pick-note svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--warn)}
.menu{position:absolute;z-index:60;min-width:170px;padding:6px}
.menu button,.pmenu button,.pmenu .row{display:flex;width:100%;align-items:center;gap:10px;padding:0 10px;height:38px;border-radius:10px;text-align:left;font-size:14px}
.menu button:hover,.pmenu button:hover{background:var(--hover)}
.menu button.danger,.pmenu button.danger{color:var(--danger)}
.menu svg,.pmenu svg{width:18px;height:18px;flex:none;color:var(--text-2)}
.menu button.danger svg{color:var(--danger)}
.pmenu{position:absolute;left:8px;right:8px;bottom:calc(100% - 2px);z-index:40;padding:6px;animation:pop .12s ease-out;transform-origin:bottom left}
.pmenu .hdr{padding:8px 10px 10px;color:var(--text-3);font-size:13px;border-bottom:1px solid var(--border);margin:0 -6px 6px;padding-left:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmenu .sp{flex:1}
.pmenu .chip-r{margin-left:auto;font-size:12px;color:var(--text-2);background:var(--surface-3);padding:2px 8px;border-radius:999px}
.pmenu .chip-r.up{background:var(--solid);color:var(--solid-ink);font-weight:600}
.pmenu hr{border:0;border-top:1px solid var(--border);margin:6px -6px}
.themes{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--surface-3);margin-left:auto}
.themes button{width:28px;height:26px;padding:0;justify-content:center;border-radius:999px;color:var(--text-3)}
.themes button svg{width:15px;height:15px;color:inherit}
.themes button.on{background:var(--elevated);color:var(--text);box-shadow:0 0 0 1px var(--border)}

/* ---- conversation */
.thread{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.thread-inner{max-width:768px;margin:0 auto;padding:10px 24px 36px}
.msg{margin:24px 0}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.bubble{max-width:min(70%,640px);background:var(--user);padding:10px 16px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;font-size:16px;line-height:1.6}
.ufoot{display:flex;justify-content:flex-end;gap:2px;margin-top:4px;min-height:30px;opacity:0;transition:opacity .15s}
.ufoot button{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--text-3)}
.ufoot button:hover{background:var(--hover);color:var(--text)}
.ufoot svg{width:16px;height:16px}
.msg.user:hover .ufoot,.msg.user:focus-within .ufoot{opacity:1}
.attach-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px;max-width:85%}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 8px 5px 10px;border:1px solid var(--border-2);border-radius:12px;background:var(--surface);font-size:13px;max-width:240px}
.chip svg{width:14px;height:14px;color:var(--text-3);flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{color:var(--text-3);flex:none}
.chip button{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--text-3)}
.chip button:hover{background:var(--hover);color:var(--text)}
.msg.bot{font-size:16px;line-height:1.65}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 1em}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.3;margin:1.5em 0 .5em;font-weight:600}
.md h1{font-size:1.5em}.md h2{font-size:1.3em}.md h3{font-size:1.12em}.md h4,.md h5,.md h6{font-size:1em}
.md ul,.md ol{margin:0 0 1em;padding-left:1.6em}
.md li{margin:.3em 0;padding-left:.2em}
.md li>ul,.md li>ol{margin:.3em 0}
.md li::marker{color:var(--text-2)}
.md a{color:var(--link);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.md strong{font-weight:600}
.md blockquote{margin:0 0 1em;padding:2px 0 2px 16px;border-left:3px solid var(--border-2);color:var(--text-2)}
.md hr{border:0;border-top:1px solid var(--border-2);margin:1.5em 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--surface-3);padding:.15em .4em;border-radius:6px}
.md .table{overflow-x:auto;margin:0 0 1em;border:1px solid var(--border-2);border-radius:12px}
.md table{border-collapse:collapse;width:100%;font-size:14.5px}
.md th,.md td{padding:8px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.md th{font-weight:600;background:var(--surface-2)}
.md tr:last-child td{border-bottom:0}
.code{margin:0 0 1em;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--code)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 16px;font-size:12.5px;color:var(--text-2);background:var(--code-head)}
.code-head button{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:8px;color:var(--text-2);font-size:12.5px}
.code-head button:hover{background:var(--hover);color:var(--text)}
.code-head svg{width:14px;height:14px}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.6}
.code pre code{background:none;padding:0;font-size:inherit;border-radius:0}
.hljs-keyword,.hljs-built_in,.hljs-selector-tag,.hljs-meta .hljs-keyword{color:var(--hl-k)}
.hljs-string,.hljs-regexp,.hljs-template-string,.hljs-addition{color:var(--hl-s)}
.hljs-number,.hljs-literal,.hljs-symbol,.hljs-attr,.hljs-attribute{color:var(--hl-n)}
.hljs-comment,.hljs-quote,.hljs-deletion{color:var(--hl-c);font-style:italic}
.hljs-title,.hljs-type,.hljs-class .hljs-title,.hljs-function .hljs-title,.hljs-tag,.hljs-name,.hljs-section{color:var(--hl-t)}
.tools{margin:0 0 12px;font-size:14px;color:var(--text-2)}
.tools summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 2px;border-radius:8px;color:var(--text-2)}
.tools summary::-webkit-details-marker{display:none}
.tools summary:hover{color:var(--text)}
.tools summary svg{width:14px;height:14px;transition:transform .15s}
.tools details[open] summary svg{transform:rotate(90deg)}
.tool-list{margin:4px 0 0 7px;padding-left:14px;border-left:1px solid var(--border-2)}
.tool{display:flex;align-items:center;gap:8px;padding:3px 0}
.tool i{width:7px;height:7px;border-radius:50%;background:var(--text);flex:none;animation:pulse 1.2s ease-in-out infinite}
.tool.done i{animation:none;background:var(--text-3)}
.tool.err i{animation:none;background:var(--danger)}
.tool span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.think{margin:0 0 12px;font-size:14px;color:var(--text-2)}
.think summary,.think .think-head{list-style:none;display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 2px;border-radius:8px;color:var(--text-2)}
.think summary{cursor:pointer}
.think .think-head{padding-left:2px}
.think summary::-webkit-details-marker{display:none}
.think summary:hover{color:var(--text)}
.think summary svg{width:14px;height:14px;transition:transform .15s}
.think[open] summary svg{transform:rotate(90deg)}
.think .live{background:linear-gradient(90deg,var(--text-3) 0%,var(--text) 45%,var(--text-3) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.8s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.think-body{margin:6px 0 2px 7px;padding:2px 0 2px 16px;border-left:1px solid var(--border-2);color:var(--text-2);font-size:14.5px;line-height:1.62}
.think-body.md p{margin:0 0 .7em}
.arts{display:flex;flex-direction:column;gap:8px;margin:2px 0 14px}
.art{display:flex;align-items:center;gap:12px;width:100%;max-width:460px;padding:9px 8px 9px 9px;border:1px solid var(--border-2);border-radius:16px;background:var(--surface);text-align:left;cursor:pointer;transition:background .15s}
.md .art{margin:0 0 1em}
.art:hover{background:var(--hover)}
.art .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-3);color:var(--text);flex:none}
.art .ico svg{width:20px;height:20px}
.art .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.art b{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art small{color:var(--text-3);font-size:12.5px}
.art .dl{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);flex:none}
.art .dl:hover{background:var(--hover);color:var(--text)}
.art .dl svg{width:17px;height:17px}
.art.off{cursor:default;opacity:.75}
.art.off:hover{background:var(--surface)}
.art.on{border-color:var(--text-2)}
.panel{grid-column:3;display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;height:100dvh;background:var(--surface);border-left:1px solid var(--border)}
.p-head{flex:none;display:flex;align-items:center;gap:6px;height:56px;padding:0 8px 0 16px;border-bottom:1px solid var(--border)}
.p-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.p-title b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title small{color:var(--text-3);font-size:12px}
.tabs{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-3);margin-right:4px}
.tabs button{height:28px;padding:0 13px;border-radius:999px;font-size:13px;color:var(--text-2)}
.tabs button.on{background:var(--elevated);color:var(--text);box-shadow:0 0 0 1px var(--border),var(--shadow-s)}
.p-body{flex:1;min-height:0;overflow:auto;position:relative;background:var(--surface-2)}
.p-body iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.p-img{display:grid;place-items:center;min-height:100%;padding:24px;background:repeating-conic-gradient(var(--surface-3) 0 25%,var(--surface-2) 0 50%) 0 0/22px 22px}
.p-img img{max-width:100%;height:auto;border-radius:6px;box-shadow:var(--shadow)}
.p-doc{max-width:740px;margin:0 auto;padding:26px 30px 48px;font-size:16px;line-height:1.66;background:var(--surface);min-height:100%}
.p-code{margin:0;min-height:100%;padding:16px 18px;background:var(--code);font-family:var(--mono);font-size:13.5px;line-height:1.6;white-space:pre;tab-size:2}
.p-code code{font-family:inherit}
.p-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;padding:24px;color:var(--text-3);text-align:center}
.thinking{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:14.5px;height:26px}
.thinking .wave{display:flex;align-items:flex-end;gap:2px;height:14px}
.thinking .wave i{width:3px;border-radius:2px;background:var(--text);animation:wave 1s ease-in-out infinite}
.thinking .wave i:nth-child(1){height:5px;animation-delay:0s}.thinking .wave i:nth-child(2){height:8px;animation-delay:.1s}.thinking .wave i:nth-child(3){height:11px;animation-delay:.2s}.thinking .wave i:nth-child(4){height:14px;animation-delay:.3s}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}
.caret::after{content:"";display:inline-block;width:9px;height:9px;margin-left:4px;vertical-align:baseline;border-radius:50%;background:var(--text);animation:pulse .9s ease-in-out infinite}
.note{margin-top:10px;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
.note.err{background:var(--danger-soft);color:var(--danger)}
.note.soft{background:var(--surface-3);color:var(--text-2)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.foot{display:flex;align-items:center;gap:2px;margin-top:6px;color:var(--text-3);font-size:12.5px;min-height:30px;opacity:0;transition:opacity .15s}
.msg.bot:hover .foot,.msg.bot:focus-within .foot,.msg.bot:last-child .foot{opacity:1}
.foot .lbl{margin-left:6px}
.foot button{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--text-3)}
.foot button:hover{background:var(--hover);color:var(--text)}
.foot svg{width:16px;height:16px}

/* ---- buttons, composer */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 16px;border-radius:999px;font-weight:500;font-size:14px;text-decoration:none;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--solid);color:var(--solid-ink)}
.btn.primary:hover{background:var(--solid-hover)}
.btn.ghost{border:1px solid var(--border-2);background:transparent;color:var(--text)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger-ghost{color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.danger-ghost:hover{background:var(--danger-soft)}
.btn[disabled]{opacity:.4;cursor:default;pointer-events:none}
.dock{flex:none;padding:0 16px max(10px,env(safe-area-inset-bottom))}
.hero{display:none;width:100%;max-width:768px;margin:0 auto 26px;padding:0 8px;text-align:center}
.hero h1{margin:0;font-size:clamp(24px,4vw,32px);font-weight:500;letter-spacing:-.01em;line-height:1.25}
.hero p{margin:10px 0 0;color:var(--text-2);font-size:15px}
.hero p:empty{display:none}
.hero code{font-family:var(--mono);font-size:.88em;background:var(--surface-3);padding:.15em .4em;border-radius:6px}
.main.is-empty .thread{display:none}
.main.is-empty .dock{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:12vh;overflow-y:auto}
.main.is-empty .hero{display:block}
.main.is-empty .legal{display:none}
.composer{max-width:768px;margin:0 auto;background:var(--elevated);border:1px solid var(--border-2);border-radius:28px;padding:8px;box-shadow:var(--shadow-s);transition:border-color .15s}
.composer.drag{border-style:dashed;border-color:var(--text-2)}
.composer.disabled{opacity:.55;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px 6px}
.chips:empty{display:none}
.composer textarea{display:block;width:100%;border:0;outline:0;background:none;resize:none;padding:8px 12px 6px;font-size:16px;line-height:1.5;max-height:40vh;min-height:44px}
.composer textarea::placeholder{color:var(--text-3)}
.c-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px}
.c-row .icon-btn{width:36px;height:36px;border-radius:50%}
.c-note{color:var(--text-3);font-size:12.5px;padding:4px 12px 2px}
.c-note:empty{display:none}
.c-note.warn{color:var(--warn)}
.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--solid);color:var(--solid-ink);flex:none;transition:opacity .15s,transform .1s}
.send:active{transform:scale(.95)}
.send[disabled]{opacity:.25;cursor:default}
.send svg{width:18px;height:18px}
.legal{max-width:768px;margin:8px auto 0;text-align:center;color:var(--text-3);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;max-width:min(560px,calc(100vw - 32px));padding:11px 18px;border-radius:999px;background:var(--solid);color:var(--solid-ink);font-size:14px;box-shadow:var(--shadow);animation:pop .16s ease-out}
.banner{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(4px)}
.banner div{text-align:center;max-width:380px;padding:24px}
.banner h2{margin:0 0 6px;font-size:20px}
.banner p{margin:0 0 16px;color:var(--text-2)}
.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 10px);width:34px;height:34px;border-radius:50%;background:var(--elevated);border:1px solid var(--border-2);display:grid;place-items:center;box-shadow:var(--shadow-s);color:var(--text-2)}
.jump svg{width:17px;height:17px}
.dock-wrap{position:relative;width:100%;max-width:768px;margin:0 auto}

/* ---- pill in the top bar, dialogs */
.pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--solid);color:var(--solid-ink)}
.pill:hover{background:var(--solid-hover)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.busy{background:var(--surface-3);color:var(--text);border:1px solid var(--border-2)}
.pill.busy i{animation:pulse 1.2s ease-in-out infinite}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.dlg{width:min(760px,calc(100vw - 24px));height:min(640px,calc(100dvh - 32px));padding:0;border:0;border-radius:24px;background:var(--elevated);color:var(--text);box-shadow:var(--shadow);overflow:hidden}
.dlg[open]{display:flex;flex-direction:column}
.dlg.small{width:min(480px,calc(100vw - 24px));height:fit-content;max-height:calc(100dvh - 32px)}
.dlg.compact{width:min(560px,calc(100vw - 24px));height:fit-content;max-height:calc(100dvh - 32px)}
.dlg.compact .dlg-body{flex:none}
.dlg a:not(.btn){color:var(--link)}
.dlg::backdrop{background:rgba(0,0,0,.5)}
.dlg-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 16px 12px 24px;border-bottom:1px solid var(--border)}
.dlg-head h2{margin:0;font-size:18px;font-weight:600;line-height:1.3}
.dlg-head p{margin:2px 0 0;color:var(--text-3);font-size:13px}
.dlg-body{flex:1;min-height:0;overflow-y:auto;padding:20px 24px 24px;overscroll-behavior:contain}
.dlg.small .dlg-body{flex:none}
.set{display:grid;grid-template-columns:190px minmax(0,1fr);flex:1;min-height:0}
.set-nav{display:flex;flex-direction:column;gap:2px;padding:12px 10px;border-right:1px solid var(--border);overflow-y:auto}
.set-nav button{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:10px;font-size:14px;text-align:left;color:var(--text)}
.set-nav button:hover{background:var(--hover)}
.set-nav button.on{background:var(--select);font-weight:500}
.set-nav button.danger{color:var(--danger)}
.set-nav svg{width:18px;height:18px;flex:none;color:var(--text-2)}
.set-nav button.danger svg{color:var(--danger)}
.set-nav .badge{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--link)}
.set-body{overflow-y:auto;padding:20px 24px 24px;min-width:0;overscroll-behavior:contain}
.set-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 24px;border-top:1px solid var(--border);background:var(--elevated)}
.set-foot .hint{margin-right:auto;color:var(--text-3);font-size:13px}
.sec{margin:0 0 22px}
.sec:last-child{margin-bottom:0}
.sec h3{margin:0 0 4px;font-size:15px;font-weight:600}
.sec p{margin:0 0 10px;color:var(--text-2);font-size:13.5px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.field label{font-size:13.5px;font-weight:500}
.field small{color:var(--text-3);font-size:12.5px}
.input{width:100%;height:42px;padding:0 14px;border:1px solid var(--border-2);border-radius:12px;background:var(--surface);outline:none}
.input:focus{border-color:var(--text-2)}
.input.bad{border-color:var(--danger)}
.input-row{display:flex;align-items:center;border:1px solid var(--border-2);border-radius:12px;background:var(--surface);overflow:hidden}
.input-row:focus-within{border-color:var(--text-2)}
.input-row input{flex:1;min-width:0;height:42px;padding:0 8px 0 14px;border:0;background:none;outline:none}
.input-row span{color:var(--text-3);padding-right:14px;white-space:nowrap;font-size:13.5px}
.switch{display:flex;align-items:flex-start;gap:14px;justify-content:space-between;margin:0 0 16px}
.switch .t{display:flex;flex-direction:column;gap:2px;font-size:14px}
.switch .t small{color:var(--text-3);font-size:12.5px;max-width:420px}
.toggle{position:relative;width:40px;height:24px;border-radius:999px;background:var(--border-2);flex:none;margin-top:2px;transition:background .15s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"]::after{transform:translateX(16px)}
.img-field{display:flex;align-items:center;gap:14px;margin:0 0 18px}
.img-prev{width:56px;height:56px;border-radius:14px;border:1px solid var(--border-2);display:grid;place-items:center;background:var(--surface-3);overflow:hidden;flex:none}
.img-prev img,.img-prev svg{width:100%;height:100%;object-fit:contain}
.img-meta{flex:1;min-width:0}
.img-meta b{display:block;font-weight:500;font-size:14px}
.img-meta small{color:var(--text-3);font-size:12.5px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-3)}
.seg button{height:30px;padding:0 14px;border-radius:999px;font-size:13.5px;color:var(--text-2)}
.seg button.on{background:var(--elevated);color:var(--text);box-shadow:0 0 0 1px var(--border),var(--shadow-s)}
.kv{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);font-size:13.5px}
.kv span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12.5px;color:var(--text-2)}
.kv .btn{height:30px;padding:0 12px;font-size:13px}
.danger-zone{border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);border-radius:16px;padding:16px}
.danger-zone h3{color:var(--danger)}
.warn-list{margin:8px 0 12px;padding-left:1.2em;color:var(--text-2);font-size:13.5px}
.warn-list li{margin:.25em 0}
.err-text{color:var(--danger);font-size:13px;margin-top:6px}
.fine{margin:12px 0 0;color:var(--text-3);font-size:12.5px;line-height:1.5}
.steps{list-style:none;margin:6px 0 4px;padding:0}
.steps li{display:flex;align-items:center;gap:12px;padding:8px 2px;color:var(--text-3)}
.steps .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--border-2);flex:none}
.steps .ic svg{width:13px;height:13px}
.steps li.active{color:var(--text);font-weight:500}
.steps li.active .ic{border-color:var(--text)}
.steps li.done{color:var(--text-2)}
.steps li.done .ic{background:var(--solid);border-color:var(--solid);color:var(--solid-ink)}
.steps li.error{color:var(--danger);font-weight:500}
.steps li.error .ic{border-color:var(--danger);color:var(--danger)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--border-2);border-top-color:var(--text);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notes{margin:0 0 4px;padding-left:1.2em;color:var(--text-2)}
.notes li{margin:.25em 0}
.earlier{margin-top:16px}
.earlier summary{cursor:pointer;color:var(--text-2);font-size:13px}
.earlier .rel{margin-top:12px}
.earlier .rel h3{margin:0 0 4px;font-size:13px}
.what{display:flex;flex-direction:column;gap:6px;margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface-3);color:var(--text-2);font-size:13.5px}
.what div{display:flex;gap:9px}
.what svg{width:15px;height:15px;flex:none;margin-top:3px;color:var(--text)}
.vrow{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:15px}
.vrow b{font-weight:600}
.vrow svg{width:16px;height:16px;color:var(--text-3)}
.linkbox{display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px 8px 8px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);font-family:var(--mono);font-size:12.5px;color:var(--text-2)}
.linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.howto{margin:14px 0 0;padding:14px 16px 14px 34px;border:1px solid var(--border);border-radius:14px;background:var(--surface-2);color:var(--text-2);font-size:13.5px}
.howto li{margin:0 0 8px;padding-left:4px}
.howto li:last-child{margin:0}
.howto b{color:var(--text);font-weight:600}
.howto code,.sec code,.fine code,.dlg-body code{font-family:var(--mono);font-size:12.5px;background:var(--surface-3);padding:.1em .4em;border-radius:6px;color:var(--text)}
.wait{display:flex;align-items:center;gap:10px;margin:14px 0 0;color:var(--text-2);font-size:13.5px}
.meters{display:flex;flex-direction:column;gap:22px}
.mt-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.mt-top b{font-weight:500;font-size:15px}
.mt-top span{color:var(--text-2);font-size:14px}
.mt-bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.mt-bar i{display:block;height:100%;border-radius:999px;background:var(--text);min-width:2px}
.mt-bar.hot i{background:var(--warn)}
.mt-bar.full i{background:var(--danger)}
.mt-sub{margin-top:6px;color:var(--text-3);font-size:13px}
.ok-text{color:var(--ok);font-weight:500}
.field .seg{align-self:flex-start;max-width:100%;overflow-x:auto}
.prog{margin:2px 0 6px}
.prog-step{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14.5px;font-weight:500}
.prog-step small{margin-left:auto;color:var(--text-3);font-weight:400;font-size:13px}
.credits{margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
.credits p{margin:0 0 14px;color:var(--text-2);font-size:13.5px}
.bal{display:flex;flex-direction:column;gap:6px;margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface-3);font-size:13.5px}
.bal div{display:flex;justify-content:space-between;gap:12px}
.bal span{color:var(--text-2)}
.bal b{font-weight:500;text-align:right}
.state{font-size:12.5px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--surface-3);color:var(--text-2)}
.state.using,.state.on{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.state.near{background:var(--warn-soft);color:var(--warn)}
.state.out{background:var(--danger-soft);color:var(--danger)}
@media (max-width:1280px) and (min-width:861px){
  .app.panel-open{--side-w:0px}
  .app.panel-open .side{display:none}
  .app.panel-open{--panel-w:min(55vw,860px)}
}
@media (max-width:860px){
  .app,.app.side-collapsed,.app.panel-open{grid-template-columns:minmax(0,1fr)}
  .main{grid-column:1}
  .panel{position:fixed;inset:0;z-index:55;border-left:0;padding-top:env(safe-area-inset-top)}
  .app .side,.app.side-collapsed .side{display:flex;position:fixed;top:0;bottom:0;left:0;width:min(86vw,300px);z-index:50;transform:translateX(-102%);transition:transform .22s ease}
  .app.side-open .side{transform:none;box-shadow:var(--shadow)}
  .app.side-open .scrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.4)}
  .only-narrow{display:grid}
  .only-wide{display:none}
  .top{padding:0 6px;gap:4px}
  .modes button{padding:0 10px}
  .modes .pre{display:none}
  .c-modes{margin-left:2px}
  .c-btn{padding:0 6px 0 9px}
  .thread-inner{padding:6px 16px 28px}
  .dock{padding:0 10px max(8px,env(safe-area-inset-bottom))}
  .bubble{max-width:88%}
  .dlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0}

      out.push(`<div class="table"><table><thead><tr>${head.map((c, k) => cell("th", c, k)).join("")}</tr></thead><tbody>${body.map(r => `<tr>${head.map((_, k) => cell("td", r[k], k)).join("")}</tr>`).join("")}</tbody></table></div>`);

function renameChat(id) {
  const item = document.querySelector(`.item[data-id="${id}"]`);
  const c = S.chats.find(x => x.id === id);
  if (!item || !c) return;
  const input = document.createElement("input");
  input.value = c.title || "";
  item.innerHTML = "";
  item.append(input);
  input.focus();
  input.select();
  let done = false;
  const finish = async save => {
    if (done) return;
    done = true;
    const t = input.value.trim();
    if (save && t && t !== c.title) {
      c.title = t;
      try { await apiJson(`/api/chats/${id}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ title: t }) }); } catch (e) { toast(e.message); }
    }
    renderHistory();
  };
  input.onkeydown = e => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
  input.onblur = () => finish(true);
  input.onclick = e => e.stopPropagation();
}
async function deleteChat(id) {
  const c = S.chats.find(x => x.id === id);
  if (!confirm(`Delete "${(c && c.title) || "this chat"}"? This can't be undone.`)) return;
  try {
    await apiJson(`/api/chats/${id}`, { method: "DELETE" });
  } catch (e) {
    toast(e.message);
    return;
  }
  S.chats = S.chats.filter(x => x.id !== id);
  if (S.chatId === id) newChat(false);
  renderHistory();
}

// What Claude's own names for its promotional credits are, in words. iguana_necktie is the Claude Code cloud-session credit.
const PROMO_NAMES = { iguana_necktie: "Claude Code cloud credits" };
function money(minor, currency) {

// The balance, promotional credits and this month's spending, read by the computer from your Claude account when that's

function balanceHtml() {

  const on = st.agent && st.agent.credits;
  if (!b || (!b.extra && !b.balance && !b.dollars)) {
    if (!on) return `<p class="fine" style="margin:0">Your balance and promotional credits show here when <b>Show your usage credit balance</b> is on in Settings → General${st.agent && st.agent.computer ? "" : ` (or run <code>${esc(CFG.command)} edit</code> on your computer)`}. They're always on ${link} too.</p>`;

  const promos = (b.balance && b.balance.promos) || [];
  for (const p of promos) rows.push([p.name ? `Promotional · ${p.name}` : "Promotional credits", money(p.amount, p.currency) + until(p.expires)]);

  if (!promos.length && !(b.dollars || []).length) rows.push(["Promotional credits", "None right now"]);
  if (b.extra) rows.push(["Spent this month", b.extra.used === null ? "—" : money(b.extra.used, cur) + (b.extra.limit === null ? (b.extra.enabled ? " · no limit" : "") : ` of ${money(b.extra.limit, cur)}`)]);

function openUsage() {

// Every time Plan usage opens, the computer reads the latest numbers (one tiny message to the cheapest model).
async function refreshUsage() {
  if (U.refreshing || !S.state || !S.state.agent.online) return;
  U.refreshing = true;
  renderUsage();
  const before = S.state.limits ? S.state.limits.at : 0;
  try {
    const r = await apiJson("/api/limits/refresh", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
    // read moments ago: what's there is the latest
    if (r.wait) S.state.limits = (await apiJson("/api/limits")) || S.state.limits;
    else {
      for (let i = 0; i < 20 && $("usageDlg").open; i++) {
        await new Promise(res => setTimeout(res, 1500));
        const l = await apiJson("/api/limits");
        if (l && l.at > before) { S.state.limits = l; break; }
      }
    }
    // the balance comes a moment after the percentages
    const was = S.state.credits ? S.state.credits.at : 0;
    for (let i = 0; i < 8 && S.state.agent.credits && $("usageDlg").open; i++) {
      const c = await apiJson("/api/credits");
      if (c && c.at > was) { S.state.credits = c; break; }
      await new Promise(res => setTimeout(res, 1000));
    }
  } catch (e) {
    if (e.message !== "Signed out" && $("usageDlg").open) toast(e.message);
  }
  U.refreshing = false;
  renderUsage();
  renderLimitNote();
}

  U.saving = true;
  renderUsage();
  try {
    const p = await apiJson("/api/prefs", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ useCredits: on }) });
    if (S.state) S.state.prefs = p;
  } catch (e) {
    if (e.message !== "Signed out") toast(e.message);
  }
  U.saving = false;
  renderUsage();
  renderLimitNote();
}

  if (l && l.limited) text = "You've hit a limit" + at;
  else if (l && l.over && !useCredits()) text = "At a plan limit, and usage credits are off here" + at;

// The switch moves at once; if the computer says no, it moves back and says why.
async function setComputer(key, value) {

  const before = { ...a.computer };
  a.computer = { ...a.computer, [key]: value };
  if (key === "credits") a.credits = value;
  if (key === "workspace") PC.ws = value;
  PC.busy = key;
  PC.err = "";

  try {
    const r = await apiJson("/api/computer", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ [key]: value }) });

  } catch (e) {
    a.computer = (e.data && e.data.computer) || before;
    PC.err = e.message === "Signed out" ? "" : switching(e);

  PC.ws = undefined;
  PC.busy = "";

async function doAct(act) {

  if (act === "update") {
    SET.busy = true; SET.err = ""; renderSettings();
    try { applyUpdate(await apiJson("/api/update/start", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ to: UP.data.latest, answers: answersNow(UP.data) }) })); }

    try { applyUpdate(await apiJson("/api/update/dismiss", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" })); } catch {}
    return doAct("update");
  }
  if (act === "cancel") {
    if (!confirm("Cancel the move? The new site is removed and this one stays as it is.")) return;
    try { applyUpdate(await apiJson("/api/admin/cancel", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" })); } catch (e) { toast(e.message); }

// One file out of a .zip. Enough of the format for an export: stored or deflated entries, and the zip64 fields a big one needs.
async function unzipEntry(buf, want) {
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const bad = new Error("That .zip file couldn't be read.");
  let end = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { end = i; break; }
  if (end < 0) throw bad;
  let count = dv.getUint16(end + 10, true);
  let p = dv.getUint32(end + 16, true);
  if ((count === 0xffff || p === 0xffffffff) && end >= 20 && dv.getUint32(end - 20, true) === 0x07064b50) {
    const z = Number(dv.getBigUint64(end - 12, true));
    if (z + 56 <= buf.length && dv.getUint32(z, true) === 0x06064b50) { count = Number(dv.getBigUint64(z + 32, true)); p = Number(dv.getBigUint64(z + 48, true)); }
  }
  const td = new TextDecoder();
  for (let n = 0; n < count && p + 46 <= buf.length && dv.getUint32(p, true) === 0x02014b50; n++) {
    const method = dv.getUint16(p + 10, true);
    let size = dv.getUint32(p + 20, true);
    const plain = dv.getUint32(p + 24, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    let at = dv.getUint32(p + 42, true);
    const name = td.decode(buf.subarray(p + 46, p + 46 + nl));
    if (want(name)) {
      for (let e = p + 46 + nl; e + 4 <= p + 46 + nl + xl; e += 4 + dv.getUint16(e + 2, true)) {
        if (dv.getUint16(e, true) !== 1) continue;
        let q = e + 4;
        if (plain === 0xffffffff) q += 8;
        if (size === 0xffffffff) { size = Number(dv.getBigUint64(q, true)); q += 8; }
        if (at === 0xffffffff) at = Number(dv.getBigUint64(q, true));
        break;
      }
      if (at + 30 > buf.length || dv.getUint32(at, true) !== 0x04034b50) throw bad;
      const start = at + 30 + dv.getUint16(at + 26, true) + dv.getUint16(at + 28, true);
      const data = buf.subarray(start, start + size);
      if (method === 0) return td.decode(data);
      if (method !== 8) throw new Error("That .zip file is packed in a way this page can't open. Unzip it and choose conversations.json instead.");
      if (!window.DecompressionStream) throw new Error("This browser can't open .zip files. Unzip it and choose conversations.json instead.");
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    }

  }

}
async function readExport(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const text = buf[0] === 0x50 && buf[1] === 0x4b ? await unzipEntry(buf, n => /(^|\/)conversations\.json$/i.test(n)) : new TextDecoder().decode(buf);
  if (text === null) throw new Error("There's no conversations.json in that file. Choose the .zip from claude.ai's export email.");
  let data;
  try { data = JSON.parse(text); } catch { data = null; }
  if (!Array.isArray(data)) throw new Error("That doesn't look like a claude.ai export. Choose the .zip from claude.ai's export email, or the conversations.json in it.");
  return data;
}
// A claude.ai conversation as the site keeps it: its text, thinking, the names of attached files, and code it wrote.
function fromExport(c) {
  if (!c || typeof c !== "object" || typeof c.uuid !== "string") return null;
  const str = v => (typeof v === "string" ? v : "");
  const messages = [];
  for (const m of Array.isArray(c.chat_messages) ? c.chat_messages : []) {
    if (!m || (m.sender !== "human" && m.sender !== "assistant")) continue;
    const blocks = Array.isArray(m.content) ? m.content.filter(b => b && typeof b === "object") : [];
    let text = blocks.filter(b => b.type === "text").map(b => str(b.text)).filter(Boolean).join("\n\n");
    for (const b of blocks) {
      const art = b.type === "tool_use" && b.input && typeof b.input === "object" ? b.input : null;
      if (art && typeof art.content === "string" && art.content) text += `${text ? "\n\n" : ""}**${str(art.title) || "Artifact"}**\n\n\`\`\`${str(art.language).replace(/[^\w+#.-]/g, "")}\n${art.content}\n\`\`\``;
    }
    if (!text) text = str(m.text);
    const names = new Set();
    const files = [...(Array.isArray(m.attachments) ? m.attachments : []), ...(Array.isArray(m.files) ? m.files : [])].filter(f => f && str(f.file_name) && !names.has(f.file_name) && names.add(f.file_name)).map(f => ({ name: f.file_name, size: Number(f.file_size) || 0 }));
    const thinking = blocks.filter(b => b.type === "thinking").map(b => str(b.thinking)).filter(Boolean).join("\n\n");
    if (!text && !files.length) continue;
    messages.push({ id: str(m.uuid), role: m.sender === "human" ? "user" : "assistant", content: text.slice(0, 120000), thinking: thinking.slice(0, 20000), files, created: Date.parse(m.created_at) || 0 });
  }
  if (!messages.length) return null;
  return { id: c.uuid, title: str(c.name).trim(), created: Date.parse(c.created_at) || 0, updated: Date.parse(c.updated_at) || 0, messages: messages.slice(-2000) };
}
async function importExport(file) {
  if (IMP.busy) return;
  Object.assign(IMP, { busy: true, phase: "read", done: 0, total: 0, added: 0, updated: 0, skipped: 0, err: "", finished: false });
  renderImport();
  try {
    const raw = await readExport(file);
    const convs = raw.map(fromExport).filter(Boolean);
    Object.assign(IMP, { phase: "send", total: convs.length, skipped: raw.length - convs.length });
    renderImport();
    let batch = [];
    let size = 0;
    const flush = async () => {
      if (!batch.length) return;
      const r = await apiJson("/api/import", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ conversations: batch }) });
      IMP.added += r.added || 0;
      IMP.updated += r.updated || 0;
      IMP.skipped += r.skipped || 0;
      IMP.done += batch.length;
      batch = [];
      size = 0;
      renderImport();
    };
    for (const c of convs) {
      let n = JSON.stringify(c).length;
      // a very long conversation keeps its newest part
      while (n > IMPORT_BATCH && c.messages.length > 1) { c.messages = c.messages.slice(Math.ceil(c.messages.length / 4)); n = JSON.stringify(c).length; }
      if (batch.length && (size + n > IMPORT_BATCH || batch.length >= 100)) await flush();
      batch.push(c);
      size += n;
    }
    await flush();
    IMP.finished = true;
  } catch (e) {
    IMP.err = e.message === "Signed out" ? "" : e.message || "That couldn't be imported.";
  }
  IMP.busy = false;
  renderImport();
  loadChats();
}

/* ---------- whatever is running: the checklist ---------- */
function upRun() { return UP.data && UP.data.run ? UP.data.run : null; }
// Behind the site: the site runs a newer version than this page. Never the other way round: for a moment after an update the
// page can be new while the site still answers as the old one, and that page is already where it should be.
// Only when GitHub has something newer than both this page and the site. Right after an update the site can still answer as
// the old version for a moment while this page is already the new one; that's not an update waiting.
function updateAvailable(u) { return !!(u && u.available && u.latest && newerThan(u.latest, CFG.version)); }
function pageIsStale() { return !!(UP.data && UP.data.current && newerThan(UP.data.current, CFG.version)); }
function newerThan(a, b) {
  const x = /^(\d+)\.(\d+)\.(\d+)/.exec(String(a || ""));
  const y = /^(\d+)\.(\d+)\.(\d+)/.exec(String(b || ""));
  if (!x || !y) return !!a && a !== b;
  for (let i = 1; i <= 3; i++) if (+x[i] !== +y[i]) return +x[i] > +y[i];
  return false;
}
function stepState(run, key) {
  let st = run.steps[key] || (key === run.step ? "active" : "pending");
  if (run.state === "error" && key === run.step && st !== "done") st = "error";
  if (run.state === "done") st = "done";
  return st;
}
function stepsHtml(run) {
  return `<ol class="steps">${(run.plan || []).map(({ key, label }) => {
    const st = stepState(run, key);
    const ic = st === "done" ? UP_ICON.check : st === "error" ? UP_ICON.x : st === "active" ? '<span class="spin"></span>' : "";
    return `<li class="${st}"${st === "active" ? ' aria-current="step"' : ""}><span class="ic">${ic}</span><span>${esc(label)}</span></li>`;
  }).join("")}</ol>`;
}
const UP_ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>'
};
// What an update brings, under its checklist. A run from before the site kept the notes with it falls back to the release's.
// One bar and the step it's on; the whole list is there if you want it.
function progressHtml(run) {
  const plan = run.plan || [];
  const done = plan.filter(({ key }) => stepState(run, key) === "done").length;
  const cur = plan.find(({ key }) => stepState(run, key) === "active") || plan[Math.min(done, plan.length - 1)];
  const pct = plan.length ? Math.max(4, Math.round(((done + 0.5) / plan.length) * 100)) : 50;
  return `<div class="prog"><div class="mt-bar"><i style="width:${pct}%"></i></div><div class="prog-step"><span class="spin"></span><span>${esc(cur ? cur.label : "Working")}</span><small>${Math.min(done + 1, plan.length)} of ${plan.length}</small></div></div><details class="earlier"><summary>All steps</summary>${stepsHtml(run)}</details>`;
}
function runNotes(run) {
  if ((run.kind || "update") !== "update") return "";
  const u = UP.data;
  const notes = run.notes && run.notes.length ? run.notes : u && u.latest === run.to ? u.notes : (u && u.whatsNew && u.whatsNew.version === run.to ? u.whatsNew.notes : []);
  return notes.length && run.state === "done" ? `<div class="sect" style="margin-top:14px"><h3>Patch notes</h3>${notesList(notes)}</div>` : "";
}
function runTitle(run) {
  return { update: `Updating to v${run.to}`, settings: "Saving your changes", move: "Moving to a new address", delete: "Deleting the site" }[run.kind || "update"] || "Working";
}

function renderJob() {
  const run = upRun() || UP.gone;
  const kind = run.kind || "update";
  const title = $("setTitle");
  const sub = $("setSub");
  const dismiss = `<button class="btn ghost" type="button" data-act="dismiss">Close</button>`;
  const info = run.info || {};
  const newLink = info.site ? `<div class="linkbox"><span>${esc(info.site)}</span><button class="btn ghost" type="button" data-copy-link="${esc(info.site)}">${I.copy}<span>Copy</span></button></div>` : "";
  let html = "";
  if (UP.gone) {
    // The site this page is talking to has been deleted: that is the end of a move or a delete.
    if (kind === "move" && info.site) {
      title.textContent = "Moved to your new address";
      sub.textContent = "The old site is deleted.";
      html = `<p style="margin:0;color:var(--text-2)">${esc(CFG.name)} now lives here. Open it, sign in with Cloudflare Access, and carry on.</p>${newLink}<div class="dlg-actions"><a class="btn primary" href="${esc(info.site)}">Open the new site</a></div>`;
    } else {
      title.textContent = "The site is deleted";
      sub.textContent = "";
      html = `<p style="margin:0;color:var(--text-2)">${esc(CFG.name)} and its chats are gone, and <code>${esc(CFG.command)}</code> has stopped. Your files in the folder Claude worked in are still there. Run the setup again whenever you want a new site.</p>`;
    }
  } else if (run.state === "running") {
    title.textContent = runTitle(run);
    sub.textContent = kind === "update" ? `From v${run.from}` : "";
    html = progressHtml(run);
    if (kind === "move" && run.step === "access") {
      html += info.site ? `<div class="sec" style="margin-top:14px"><h3>Turn on Cloudflare Access for the new address</h3><p>Nobody can open the new site until you do. This one stays online meanwhile.</p><ol class="howto"><li>Open the <a href="${esc(info.dash || "https://dash.cloudflare.com/")}" target="_blank" rel="noopener noreferrer">Cloudflare dashboard</a>: <b>Workers &amp; Pages</b> &rarr; <b>${esc(info.name || "")}</b> &rarr; <b>Settings</b> &rarr; <b>Domains &amp; Routes</b>.</li><li>On the <b>workers.dev</b> row choose <b>Enable Cloudflare Access</b>, then <b>Manage Cloudflare Access</b> and allow only <b>your own email address</b>.</li><li>Open your <a href="${esc(info.claim || info.site)}" target="_blank" rel="noopener noreferrer">claim link</a> and sign in with that email. That makes the new site yours.</li></ol><div class="wait"><span class="spin"></span><span>Waiting for you to open the new site. This page updates by itself.</span></div><div class="dlg-actions"><a class="btn primary" href="${esc(info.claim || info.site)}" target="_blank" rel="noopener noreferrer">Open the claim link</a><button class="btn ghost" type="button" data-act="cancel">Cancel the move</button></div></div>` : "";
    } else {
      html += `<p class="fine">You can close this: it carries on by itself, and the button in the top bar shows how far it's got.${UP.failing > 1 ? " Reconnecting to the site…" : ""}</p><div class="dlg-actions"><button class="btn ghost" type="button" data-act="hide">Hide</button></div>`;
    }
  } else if (run.state === "done") {
    if (kind === "settings") {
      title.textContent = "Your changes are live";
      sub.textContent = "";
      html = stepsHtml(run) + `<div class="dlg-actions"><button class="btn primary" type="button" data-act="reload">Reload to see them</button></div>`;
    } else {
      const to = run.to || (UP.data && UP.data.current);
      title.textContent = `Updated to v${to}`;
      sub.textContent = "Your chats are all still here.";
      html = stepsHtml(run) + runNotes(run) + `<p class="fine">Switching this page to the new version.</p><div class="dlg-actions"><button class="btn primary" type="button" data-act="reload">Reload now</button></div>`;
    }
  } else {
    title.textContent = kind === "move" && run.step === "cleanup" ? "The new site is ready" : "That didn't finish";
    sub.textContent = "";
    html = stepsHtml(run) + `<div class="note err">${esc(run.message || "Something went wrong.")}</div>${kind === "move" && run.step === "cleanup" && info.site ? `<p class="fine">Your new site works. Open it from here:</p>${newLink}` : '<p class="fine">Your chats are safe.</p>'}<div class="dlg-actions">${kind === "update" && UP.data && UP.data.available ? `<button class="btn primary" type="button" data-act="retry"${UP.data.blocked ? " disabled" : ""}>Try again</button>` : ""}${dismiss}</div>`;
  }
  $("setBody").innerHTML = `<div class="dlg-body">${html}</div>`;
  $("setFoot").hidden = true;
}

/* ---------- following a job from any device ---------- */
const OPEN_LABEL = { update: "Updating", settings: "Saving", move: "Moving", delete: "Deleting" };
function renderPill() {
  const b = $("updatePill");
  const run = upRun();
  const u = UP.data;
  let text = "", short = "", cls = "pill";
  if (UP.gone) { b.hidden = true; return; }
  if (run && run.state === "running") {
    const total = (run.plan || []).length;
    const done = (run.plan || []).filter(({ key }) => stepState(run, key) === "done").length;
    const at = Math.min(done + 1, total); // the step it's on, as the update screen counts it
    text = run.kind === "delete" ? "Deleting…" : `${OPEN_LABEL[run.kind || "update"]} ${at}/${total}`; short = `${at}/${total}`; cls += " busy";
  } else if (run && run.state === "error") { text = "Didn't finish"; short = "Failed"; cls += " bad"; }
  else if (run && run.state === "done" && run.kind === "settings") { text = "Reload"; short = "Reload"; }
  else if (run && run.state === "done" && UP.seen === run.id && !pageIsStale()) { text = "Updated · Reload"; short = "Reload"; }
  else if (pageIsStale() && !reloadAsked()) { text = "Updated · Reload"; short = "Reload"; }
  else if (updateAvailable(u)) { text = "Update available"; short = "Update"; }
  b.hidden = !text;
  b.className = cls;
  $("pillText").textContent = text;
  $("pillShort").textContent = short;
}
// One click: a finished update or change reloads straight away, rather than opening a panel that has another Reload button.
$("updatePill").onclick = () => {
  const run = upRun();
  if (run ? run.state === "done" : pageIsStale()) return reloadNow();
  openSettings(run ? "general" : "updates");
};

// Reloading for a version is remembered in this browser. If the page that comes back is still the old one (for a few seconds
// after an update, Cloudflare can still hand out the previous version), it says nothing more about it and quietly tries again.
function reloadNow() {
  if (pageIsStale()) store.set("reloadFor", UP.data.current);
  location.reload();
}
function reloadAsked() { return pageIsStale() && store.get("reloadFor", "") === UP.data.current; }

// A page that is behind the site (an update finished, here or from another device) moves to the new version by itself, as
// soon as that can't lose anything: nothing typed or attached, no reply being written, no unsaved changes in Settings. At most
// three times per version in a tab, further apart each time, so a page that somehow stays old can't loop.
function reloadedTo() { try { return sessionStorage.getItem("gql.reloadedTo") || ""; } catch { return ""; } }
function maybeReload(wait) {
  clearTimeout(UP.reloadTimer);
  const run = upRun();
  const [ver, n] = reloadedTo().split("#");
  const tries = ver === UP.data.current ? Number(n) || 1 : 0;
  if (!pageIsStale() || UP.gone || (run && run.state !== "done") || tries >= 3) return;
  UP.reloadTimer = setTimeout(() => {
    const r = upRun();
    if (!pageIsStale() || (r && r.state !== "done")) return;
    if ($("input").value.trim() || S.files.length || S.busy || S.live || isDirty()) return maybeReload(2000);
    try { sessionStorage.setItem("gql.reloadedTo", `${UP.data.current}#${tries + 1}`); } catch {}
    reloadNow();
  }, Math.max(wait, tries * 5000));
}
// After an update, the first time this browser opens the new version, the Updates panel opens with the patch notes.
function announceVersion() {
  const seen = store.get("seenVersion", "");
  store.set("seenVersion", CFG.version);
  const w = UP.data && UP.data.whatsNew;
  if (seen === CFG.version || upRun() || !w || !w.updated || w.version !== CFG.version) return;
  SET.justUpdated = true;
  openSettings("updates");
}

function schedulePoll() {
  clearTimeout(UP.timer);
  const run = upRun();
  if (run && run.state === "running" && !UP.gone) UP.timer = setTimeout(pollUpdate, 1500);
}
// Not through api(): while a site is being deleted or moved, a failed or redirected request is the expected way for it to end.
async function pollUpdate() {
  clearTimeout(UP.timer);
  let u = null;
  try {
    const res = await fetch("/api/update", { redirect: "manual", credentials: "same-origin" });
    if (res.ok && res.type !== "opaqueredirect") u = await res.json().catch(() => null);
  } catch {}
  if (u && u.current !== undefined) {
    UP.failing = 0;
    return applyUpdate(u);
  }
  UP.failing++;
  const run = UP.lastRun;
  const ending = run && run.state === "running" && (run.kind === "delete" || (run.kind === "move" && (run.step === "cleanup" || UP.failing >= 6)));
  if (ending && UP.failing >= 3) {
    UP.gone = run;
    clearTimeout(UP.timer);
    renderPill();
    // the site this page belongs to is gone: say so, whether or not the panel was open
    if (!$("setDlg").open) $("setDlg").showModal();
    renderSettings();
    return;
  }
  if ($("setDlg").open && upRun()) renderSettings();
  schedulePoll();
}
function finishedHere(run) { return !!run && run.state === "done" && !pageIsStale() && UP.seen !== run.id; }
function applyUpdate(u) {
  if (!u) return;
  const prev = upRun();
  UP.data = u;
  const run = upRun();
  if (run) UP.lastRun = run;
  // Seen running here: the pill shows how it's going. The panel only opens if it was started here (it's open already then).
  if (run && run.state === "running" && UP.seen !== run.id) UP.seen = run.id;
  if (prev && prev.state === "running" && run && run.state === "done" && !$("setDlg").open) toast(run.kind === "settings" ? "Your changes are live. Reload to see them." : `Updated to v${run.to}. Switching to it…`, 8000);
  // A finished update or change that this page didn't watch is already in it: the page was loaded (or reloaded) after it was
  // done. So there's nothing to say about it anymore, here or on any other device, and it's cleared until the next one. Only
  // a page that watched it, or is still on the old version, says "Updated · Reload", and only until it reloads once.
  if (finishedHere(run)) {
    UP.data = { ...u, run: null };
    if (!UP.dismissing) {
      UP.dismissing = true;
      api("/api/update/dismiss", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" }).catch(() => {}).finally(() => { UP.dismissing = false; });
    }
  }
  renderPill();
  if ($("setDlg").open) renderSettings();
  if (!$("pmenu").hidden) $("pmenu").innerHTML = profileMenu();
  renderChrome();
  schedulePoll();
  if (pageIsStale()) maybeReload(prev && prev.state === "running" ? 2500 : 600);
}

applyTheme();

renderBar();
renderChrome();
(async () => {
  await Promise.all([loadState(), loadChats()]);
  announceVersion();
  const m = location.pathname.match(/^\/c\/([\w-]+)/);
  if (m) await openChat(m[1], false);
  else input.focus();
  if (document.readyState === "complete") highlight(document);
  else window.addEventListener("load", () => highlight(document));
})();
})();
</script>
