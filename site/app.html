<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>try{var t=JSON.parse(localStorage.getItem("gql.theme"));if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>__TAB_TITLE__</title>
<link rel="icon" href="/favicon">
<style>
/* The look follows ChatGPT's as it is now, colours taken from its page: one colour for the page and the sidebar (black in
   dark, white in light) with a hairline between, a #1b1b1b message box with ChatGPT's blue #2c68c6 button, its light blue
   for links, the "Chat | Work" switch at the top (here Chat | Files), a teal avatar, filled 20px icons and the system font.
   The dark colours are in two blocks, one for "System" when the computer is dark and one for "Dark": they must stay the same. */
:root{
  --surface:#ffffff;--surface-2:#ffffff;--surface-3:#f3f3f3;--elevated:#ffffff;--menu:#ffffff;--composer:#f3f3f3;
  --text:#0d0d0d;--text-2:#5d5d5d;--text-3:#8f8f8f;--nav:#2b2b2b;--ph:#8f8f8f;
  --border-0:#ececec;--border:rgba(13,13,13,.10);--border-2:rgba(13,13,13,.15);
  --hover:#f0f0f0;--hover-2:#e8e8e8;--select:#ececec;
  --solid:#000000;--solid-ink:#ffffff;--solid-hover:#303030;--solid-off:#d7d7d7;--solid-off-ink:#f4f4f4;
  --btn:#181818;--btn-ink:#ffffff;--btn-hover:#303030;--pill:#f0f0f0;--tip:#0d0d0d;--tip-ink:#ffffff;
  --link:#2c68c6;--blue:#2c68c6;--focus:#2c68c6;--toggle:#2c68c6;--toggle-off:#dfdfdf;--accent:#2c68c6;--avatar:#1abc9c;
  --danger:#e02e2a;--danger-text:#ba2623;--danger-soft:color-mix(in oklab,#fa423e 8%,transparent);
  --warn:#b9480d;--warn-soft:color-mix(in oklab,#fb6a22 8%,transparent);--ok:#008635;
  --user:#f3f3f3;--code:#f7f7f7;
  --inline:rgba(13,13,13,.04);--inline-ring:rgba(13,13,13,.08);--quote:rgba(13,13,13,.15);
  --seg:#f0f0f0;--seg-on:#ffffff;
  --composer-edge:none;
  --shadow:0 10px 15px -3px rgba(0,0,0,.10),0 4px 6px -4px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.08);
  --shadow-s:0 1px 2px -1px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.08);
  --scrim:rgba(0,0,0,.30);--scroll:rgba(13,13,13,.3);
  --hl-1:#c0660d;--hl-2:#0169cc;--hl-3:#008635;--hl-4:#e04c91;--hl-5:#8046d9;
  --mono:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Monaco,Consolas,"Liberation Mono","DejaVu Sans Mono","Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:#000000;--surface-2:#000000;--surface-3:#1b1b1b;--elevated:#1b1b1b;--menu:#1f1f1f;--composer:#1b1b1b;
    --text:#f3f3f3;--text-2:#b4b4b4;--text-3:#7d7d7d;--nav:#cccccc;--ph:#dcdcdc;
    --border-0:#1a1a1a;--border:rgba(255,255,255,.10);--border-2:rgba(255,255,255,.16);
    --hover:#1a1a1a;--hover-2:#262626;--select:#1a1a1a;
    --solid:#ffffff;--solid-ink:#000000;--solid-hover:#ececec;--solid-off:#676767;--solid-off-ink:#2f2f2f;
    --btn:#f3f3f3;--btn-ink:#0d0d0d;--btn-hover:#ededed;--pill:#222222;--tip:#3a3a3a;--tip-ink:#ffffff;
    --link:#80a9e0;--blue:#80a9e0;--focus:#2c68c6;--toggle:#2c68c6;--toggle-off:#414141;--accent:#2c68c6;--avatar:#1abc9c;
    --danger:#e02e2a;--danger-text:#fa423e;--danger-soft:color-mix(in oklab,#fa423e 16%,transparent);
    --warn:#ff8549;--warn-soft:color-mix(in oklab,#fb6a22 16%,transparent);--ok:#04b84c;
    --user:#1b1b1b;--code:#121212;
    --inline:rgba(255,255,255,.10);--inline-ring:rgba(255,255,255,.08);--quote:rgba(255,255,255,.20);
    --seg:#131313;--seg-on:#1b1b1b;
    --composer-edge:none;
    --shadow:0 10px 15px -3px rgba(0,0,0,.40),0 4px 6px -4px rgba(0,0,0,.40),0 0 0 1px rgba(255,255,255,.10);
    --shadow-s:0 1px 2px -1px rgba(0,0,0,.2),0 0 0 1px rgba(255,255,255,.10);
    --scrim:rgba(0,0,0,.60);--scroll:rgba(255,255,255,.3);
    --hl-1:#ffe48c;--hl-2:#66b5ff;--hl-3:#40c977;--hl-4:#ff8cc1;--hl-5:#ad7bf9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface:#000000;--surface-2:#000000;--surface-3:#1b1b1b;--elevated:#1b1b1b;--menu:#1f1f1f;--composer:#1b1b1b;
  --text:#f3f3f3;--text-2:#b4b4b4;--text-3:#7d7d7d;--nav:#cccccc;--ph:#dcdcdc;
  --border-0:#1a1a1a;--border:rgba(255,255,255,.10);--border-2:rgba(255,255,255,.16);
  --hover:#1a1a1a;--hover-2:#262626;--select:#1a1a1a;
  --solid:#ffffff;--solid-ink:#000000;--solid-hover:#ececec;--solid-off:#676767;--solid-off-ink:#2f2f2f;
  --btn:#f3f3f3;--btn-ink:#0d0d0d;--btn-hover:#ededed;--pill:#222222;--tip:#3a3a3a;--tip-ink:#ffffff;
  --link:#80a9e0;--blue:#80a9e0;--focus:#2c68c6;--toggle:#2c68c6;--toggle-off:#414141;--accent:#2c68c6;--avatar:#1abc9c;
  --danger:#e02e2a;--danger-text:#fa423e;--danger-soft:color-mix(in oklab,#fa423e 16%,transparent);
  --warn:#ff8549;--warn-soft:color-mix(in oklab,#fb6a22 16%,transparent);--ok:#04b84c;
  --user:#1b1b1b;--code:#121212;
  --inline:rgba(255,255,255,.10);--inline-ring:rgba(255,255,255,.08);--quote:rgba(255,255,255,.20);
  --seg:#131313;--seg-on:#1b1b1b;
  --composer-edge:none;
  --shadow:0 10px 15px -3px rgba(0,0,0,.40),0 4px 6px -4px rgba(0,0,0,.40),0 0 0 1px rgba(255,255,255,.10);
  --shadow-s:0 1px 2px -1px rgba(0,0,0,.2),0 0 0 1px rgba(255,255,255,.10);
  --scrim:rgba(0,0,0,.60);--scroll:rgba(255,255,255,.3);
  --hl-1:#ffe48c;--hl-2:#66b5ff;--hl-3:#40c977;--hl-4:#ff8cc1;--hl-5:#ad7bf9;
  color-scheme:dark;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
[hidden]{display:none!important}
/* a tooltip like ChatGPT's: a small label under an icon button, on hover or keyboard focus. Near the right edge it lines up
   with the button's right side instead, so it stays on screen. */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:20;padding:5px 9px;border-radius:8px;background:var(--tip);color:var(--tip-ink);font-size:12px;line-height:16px;font-weight:500;letter-spacing:0;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 4px 12px rgba(0,0,0,.18)}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transition-delay:.15s}
[data-tip-end]::after{left:auto;right:0;transform:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--text);font-family:ui-sans-serif,-apple-system,system-ui,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif,"Segoe UI Emoji","Segoe UI Symbol";font-size:14px;line-height:1.4286;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis-weight:none;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
svg{display:block;flex:none}

/* ---- layout and sidebar */
.app{--side-w:clamp(260px,23.5vw,352px);--panel-w:0px;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--panel-w);height:100vh;height:100dvh}
.app.panel-open{--panel-w:min(50vw,860px)}
.side{grid-column:1;background:var(--surface-2);display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--border-0)}
.side-top{flex:none;display:flex;align-items:center;gap:2px;height:56px;padding:0 8px 0 12px}
/* the site's name as a wordmark, like "ChatGPT" at the top of its sidebar; a logo of your own goes before it */
.brand{display:flex;align-items:center;gap:8px;min-width:0;height:36px;margin-right:auto;padding:0 9px;border-radius:8px;color:var(--text);text-decoration:none;font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.brand:hover{background:var(--hover)}
.brand>img,.brand>svg{display:none;width:24px;height:24px;border-radius:6px;object-fit:contain;flex:none}
.brand>span:not(.brand-open){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-open{display:none}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--text);flex:none}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{background:var(--hover)}
.icon-btn svg{width:20px;height:20px}
.side-nav{display:flex;flex-direction:column;gap:1px;padding-top:4px}
.nav-item{display:flex;align-items:center;gap:8px;min-height:36px;margin:0 8px;padding:0 12px;text-decoration:none;border-radius:10px;font-size:14px;line-height:20px;color:var(--nav);text-align:left;cursor:pointer}
.nav-item:hover,.nav-item:focus-within,.nav-item.on{background:var(--hover);color:var(--text)}
/* search is the magnifier at the top, as in ChatGPT: its field only shows while it's being used */
.side:not(.searching) #searchRow{display:none}
.nav-item svg{width:20px;height:20px}
.nav-item>span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item input{flex:1;min-width:0;height:36px;border:0;background:none;outline:none;padding:0}
.nav-item input::-webkit-search-cancel-button{display:none}
.nav-item input::placeholder{color:var(--nav)}
.nav-item input:focus::placeholder{color:var(--text-3)}
.nav-item kbd{font:inherit;font-size:14px;line-height:20px;color:var(--text-3);white-space:nowrap;opacity:0;transition:opacity .15s}
.nav-item:hover kbd{opacity:1}
.nav-item input:not(:placeholder-shown)~kbd,.nav-item input:focus~kbd{display:none}
.history-label{padding:24px 20px 8px;font-size:14px;line-height:20px;font-weight:500;color:var(--text-2)}
.history{flex:1;overflow-y:auto;padding:0 0 8px;min-height:0}
.item{position:relative;display:flex;align-items:center;margin:0 6px;border-radius:10px}
.item{margin:0 8px}
.item a{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;color:var(--nav);text-decoration:none;border-radius:10px;font-size:14px;line-height:20px}
.item:hover a,.item.on a{color:var(--text)}
.item a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item a.sub{min-height:48px;padding-top:6px;padding-bottom:6px}
.item a .tt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.item a .tt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-3);font-size:12px}
.item:hover{background:var(--hover)}
.item.on{background:var(--select)}
.item .more{opacity:0;width:28px;height:28px;margin-right:6px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);flex:none}
.item:hover .more,.item.on .more,.item .more[aria-expanded="true"],.item .more:focus-visible{opacity:1}
.item .more:hover{color:var(--text)}
.item .more svg{width:20px;height:20px}
.item .live{width:7px;height:7px;border-radius:50%;background:var(--text);flex:none;animation:pulse 1.4s ease-in-out infinite}
.item input{flex:1;min-width:0;margin:2px;padding:5px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);outline:none;font-size:14px}
.empty-list{padding:8px 16px;color:var(--text-3);font-size:13px}
.opening{display:flex;align-items:center;justify-content:center;gap:10px;padding:56px 0;color:var(--text-3);font-size:14px}
.side-foot{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px max(10px,env(safe-area-inset-bottom));position:relative}
.profile{display:flex;align-items:center;gap:10px;flex:1;min-width:0;min-height:52px;padding:0 8px;border-radius:10px;text-align:left}
.profile:hover,.profile[aria-expanded="true"]{background:var(--hover)}
.avatar{position:relative;width:32px;height:32px;border-radius:50%;background:var(--avatar);color:#e8fffa;display:grid;place-items:center;font-weight:500;font-size:12px;line-height:1;flex:none;text-transform:uppercase}
.who{display:flex;flex-direction:column;min-width:0}
.who b{font-weight:500;font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* like ChatGPT's Upgrade beside you: here, the update waiting */
.side-up{flex:none;height:32px;padding:0 14px;border-radius:999px;background:var(--pill);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap}
.side-up:hover{background:var(--hover-2)}
.who small{color:var(--text-2);font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small:empty{display:none}
.scrim{display:none}
/* collapsed, the sidebar is a rail of icons, like ChatGPT's: the logo (which turns into "open sidebar" under the pointer), new chat, search, and you */
@media (min-width:861px){
  .app.side-collapsed{--side-w:52px}
  .app.side-collapsed .side{border-right:1px solid var(--border-0)}
  .app.side-collapsed .side-top{justify-content:center}
  .app.side-collapsed .brand{width:36px;padding:0;justify-content:center;margin:0}
  .app.side-collapsed .brand>img,.app.side-collapsed .brand>svg{display:block}
  .app.side-collapsed .side #searchRow{display:flex}
  .app.side-collapsed .brand>span:not(.brand-open),.app.side-collapsed #searchBtn,.app.side-collapsed .side-up{display:none}
  .app.side-collapsed .side-foot{justify-content:center}
  .app.side-collapsed #hideSide,.app.side-collapsed .history-label,.app.side-collapsed .history,.app.side-collapsed .nav-item>span,.app.side-collapsed .nav-item input,.app.side-collapsed .nav-item kbd,.app.side-collapsed .who{display:none}
  .app.side-collapsed .brand{cursor:e-resize}
  .app.side-collapsed .brand:hover>:not(.brand-open){display:none}
  .app.side-collapsed .brand:hover .brand-open{display:grid}
  .app.side-collapsed .brand-open svg{width:20px;height:20px}
  .app.side-collapsed .nav-item{width:36px;margin:0 8px;padding:0;justify-content:center}
  .app.side-collapsed .side-foot{margin-top:auto;padding:8px}
  .app.side-collapsed .profile{width:36px;min-height:36px;margin:0;padding:0;justify-content:center}
  .app.side-collapsed .pmenu{left:6px;right:auto;width:280px}
  #hideSide{cursor:w-resize}
}

/* ---- the top bar: ChatGPT's model switcher on the left, the update button and the chat's ⋯ on the right */
.main{grid-column:2;display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;height:100dvh;position:relative}
.top{flex:none;height:56px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px;padding:0 10px;position:relative;z-index:2}
.top-l,.top-r{display:flex;align-items:center;gap:4px;min-width:0}
.top-r{justify-content:flex-end}
/* ChatGPT's "Chat | Work" switch: here the chat, and the file browser */
.views{display:inline-flex;align-items:center;border-radius:999px;background:var(--seg)}
.views button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:37px;min-width:112px;padding:0 24px;border-radius:999px;font-size:15px;line-height:20px;color:var(--text);white-space:nowrap}
.views button.on{background:var(--seg-on);box-shadow:var(--shadow-s)}
.views button.alt{color:var(--blue)}
.views button.alt svg{width:16px;height:16px}
.views button:not(.on):hover{background:var(--hover)}
.only-narrow{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9999px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;color:var(--text);flex:none}
.pill:hover{background:var(--hover)}
.pill svg{width:20px;height:20px}
.pill i{display:none;width:8px;height:8px;margin:0 2px;border-radius:50%;background:currentColor;flex:none}
.pill.busy i{display:block;animation:pulse 1.2s ease-in-out infinite}
.pill.busy svg{display:none}
.pill.bad{color:var(--danger-text)}
/* an update waiting: blue, like ChatGPT's "Upgrade" */
.pill.up{color:var(--blue);font-weight:400;font-size:15px}
.pill.up:hover{background:none;opacity:.85}

/* ---- menus and popovers: no border, a hairline in the shadow, rows 36px high with 20px icons */
.menu,.pmenu,.pop{background:var(--menu);border-radius:16px;box-shadow:var(--shadow);font-size:14px;line-height:20px;color:var(--text)}
.pop{position:fixed;z-index:70;width:300px;max-width:calc(100vw - 16px);padding:6px;overflow-y:auto;overscroll-behavior:contain;animation:pop .35s cubic-bezier(.19,1,.22,1)}
#permMenu{width:340px}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.mh{padding:6px 10px 4px;color:var(--text-3);font-size:12px;line-height:18px}
.pop hr,.menu hr,.pmenu hr{border:0;height:1px;background:var(--border);margin:6px -6px}
.pm{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:6px 10px;border-radius:10px;text-align:left;color:var(--text)}
.pm:hover{background:var(--hover-2)}
.pop :focus-visible,.menu :focus-visible,.pmenu :focus-visible{outline-offset:-2px}
.pm .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.pm b{font-weight:400;font-size:14px;line-height:20px}
.pm small{color:var(--text-3);font-size:12px;line-height:16px}
.pm .tag{display:flex;align-items:center;gap:4px;margin-top:2px;color:var(--text-3);font-size:12px;line-height:16px}
.pm .tag svg{width:14px;height:14px}
.pm .tick{width:20px;height:20px;visibility:hidden}
.pm.on .tick{visibility:visible}
.pm[disabled]{opacity:.5;cursor:default}
.pm[disabled]:hover{background:none}
.pick-note{display:flex;gap:8px;margin:6px 4px 4px;padding:8px 10px;border-radius:10px;background:var(--hover);color:var(--text-2);font-size:12px;line-height:16px}
.pick-note svg{width:16px;height:16px;color:var(--text-2)}
.ctx-pop{padding:8px 10px}
.ctx-pop b{font-weight:600;font-size:14px}
.ctx-meter{height:6px;border-radius:999px;background:var(--hover-2);margin:10px 0 8px;overflow:hidden}
.ctx-meter i{display:block;height:100%;border-radius:inherit;background:var(--text)}
.ctx-pop p{margin:0;font-size:13px;line-height:18px;color:var(--text-2)}
.ctx-pop p.fine{margin-top:8px;font-size:12px;line-height:16px;color:var(--text-3)}
.menu{position:absolute;z-index:60;min-width:200px;padding:6px;animation:pop .35s cubic-bezier(.19,1,.22,1);transform-origin:top left}
.menu button,.pmenu button,.pmenu .row{display:flex;width:100%;align-items:center;gap:8px;min-height:36px;padding:6px 10px;border-radius:10px;text-align:left;font-size:14px;line-height:20px;color:var(--text)}
.menu button:hover,.pmenu button:hover{background:var(--hover-2)}
.menu button.danger,.pmenu button.danger{color:var(--danger-text)}
.menu svg,.pmenu svg{width:20px;height:20px}
.pmenu{position:absolute;left:6px;right:6px;bottom:calc(100% - 4px);z-index:40;padding:6px;animation:pop .35s cubic-bezier(.19,1,.22,1);transform-origin:bottom left}
.pmenu .hdr{padding:6px 10px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmenu .hdr small{display:block;color:var(--text-3);font-size:12px;line-height:16px}
.pmenu .chip-r{margin-left:auto;color:var(--text-3);font-size:12px;line-height:16px}
.pmenu .th-row{gap:8px;padding:0 4px 0 10px;flex-wrap:nowrap}
.themes{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--seg);margin-left:auto}
.pmenu .themes button{width:28px;min-height:24px;height:24px;padding:0;justify-content:center;border-radius:999px;color:var(--text-3)}
.pmenu .themes button:hover{background:none;color:var(--text)}
.pmenu .themes button svg{width:16px;height:16px}
.pmenu .themes button.on{background:var(--seg-on);color:var(--text);box-shadow:var(--shadow-s)}

/* ---- the conversation */
.thread{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.thread-inner{box-sizing:content-box;max-width:768px;margin:0 auto;padding:0 24px 32px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end;padding-top:12px}
.msg.bot+.msg.user{padding-top:24px}
.bubble{max-width:70%;background:var(--user);padding:6px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:24px}
.bubble.multi{padding:12px 16px}
.ufoot{display:flex;justify-content:flex-end;margin-top:4px;opacity:0;transition:opacity .15s}
.ufoot button,.foot button{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--text-2)}
.ufoot button:hover,.foot button:hover{background:var(--hover);color:var(--text)}
.ufoot svg,.foot svg{width:20px;height:20px}
.msg.user:hover .ufoot,.msg.user:focus-within .ufoot{opacity:1}
.attach-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px;max-width:85%}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 6px 0 10px;border:1px solid var(--border);border-radius:12px;background:var(--surface);font-size:13px;max-width:240px}
.chip svg{width:16px;height:16px;color:var(--text-2)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{color:var(--text-3);flex:none}
.chip button{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--text-2)}
.chip button:hover{background:var(--hover);color:var(--text)}
.chip button svg{width:14px;height:14px}
.msg.bot{padding-top:20px;font-size:16px;line-height:28px}
.md{overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md p{margin:1em 0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{font-weight:600}
.md h1{font-size:1.75em;line-height:1.222;letter-spacing:-.04rem;margin:1.5rem 0 .5rem}
.md h2{font-size:1.5em;line-height:1.222;margin:2rem 0 1rem}
.md h3{font-size:1.25em;line-height:1.3;margin:1.125rem 0 .625rem}
.md h4,.md h5,.md h6{font-size:1em;line-height:1.5;margin:1rem 0 .5rem}
.md ul,.md ol{margin:.5em 0 1em;padding-left:1.625em}
.md li{margin:.5em 0;padding-left:.375em}
.md li>ul,.md li>ol{margin:.5em 0}
.md li::marker{color:var(--text-2);font-weight:500}
.md a{color:var(--link);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.md strong{font-weight:600}
.md blockquote{position:relative;margin:1em 0;padding:.25em 0 .25em 24px}
.md blockquote>:first-child{margin-top:0}
.md blockquote>:last-child{margin-bottom:0}
.md blockquote::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:2px;background:var(--quote)}
.md hr{border:0;border-top:1px solid var(--border);margin:2em 0}
.md code{font-family:var(--mono);font-size:.875em;font-weight:500;padding:1px .3rem;border-radius:4px;background:var(--inline);box-shadow:inset 0 0 0 1px var(--inline-ring)}
.md .table{overflow-x:auto;margin:2em 0}
.md table{width:100%;border-collapse:separate;border-spacing:0;font-size:.875em;line-height:1.7142857}
.md th{text-align:start;font-weight:600;padding:8px;line-height:20px;border-bottom:1px solid var(--border-2);vertical-align:bottom}
.md td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.md th:first-child,.md td:first-child{padding-left:0}
.md th:last-child,.md td:last-child{padding-right:0}
.md tbody tr:last-child td{border-bottom:0}
/* a code block is one colour, header and all; the header stays in view while a long block scrolls past */
.code{margin:1em 0;border-radius:16px;background:var(--code)}
.code-head{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 8px 0 16px;border-radius:16px 16px 0 0;background:var(--code);font-size:12px;line-height:16px;color:var(--text-2)}
.code-head button{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:8px;color:var(--text-2);font-size:12px;line-height:16px}
.code-head button:hover{background:var(--hover);color:var(--text)}
.code-head svg{width:16px;height:16px}
.code pre{margin:0;padding:0 16px 16px;overflow-x:auto;font-family:var(--mono);font-size:14px;line-height:1.5}
.code pre code,.md .code pre code{background:none;box-shadow:none;padding:0;font-size:inherit;font-weight:400;border-radius:0}
/* OpenAI's own syntax colours */
.hljs-keyword,.hljs-meta .hljs-keyword,.hljs-symbol,.hljs-deletion,.hljs-selector-pseudo{color:var(--hl-2)}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-template-tag,.hljs-meta .hljs-string{color:var(--hl-3)}
.hljs-title,.hljs-title.function_,.hljs-title.class_,.hljs-built_in,.hljs-section{color:var(--hl-1)}
.hljs-attr,.hljs-attribute,.hljs-tag,.hljs-name,.hljs-selector-tag,.hljs-selector-class,.hljs-selector-id,.hljs-selector-attr,.hljs-type,.hljs-variable,.hljs-template-variable,.hljs-property{color:var(--hl-4)}
.hljs-number,.hljs-literal,.hljs-link,.hljs-bullet{color:var(--hl-5)}
.hljs-comment,.hljs-quote{color:color-mix(in oklab,currentColor 50%,transparent)}
.hljs-punctuation,.hljs-operator,.hljs-meta{color:color-mix(in oklab,var(--text) 60%,transparent)}
.hljs-variable.language_{color:inherit}
.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:600}
.tools{margin:0 0 12px;font-size:14px;line-height:20px;color:var(--text-2)}
.tools summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 2px;border-radius:8px;color:var(--text-2)}
.tools summary::-webkit-details-marker{display:none}
.tools summary:hover{color:var(--text)}
.tools summary svg{width:16px;height:16px;transition:transform .15s}
.tools details[open] summary svg{transform:rotate(90deg)}
.tool-list{margin:4px 0 0 7px;padding-left:14px;border-left:1px solid var(--border-2)}
.tool{display:flex;align-items:center;gap:8px;padding:3px 0}
.tool i{width:7px;height:7px;border-radius:50%;background:var(--text);flex:none;animation:pulse 1.2s ease-in-out infinite}
.tool.done i{animation:none;background:var(--text-3)}
.tool.err i{animation:none;background:var(--danger)}
.tool span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.msg .think{margin:0 0 12px;font-size:14px;line-height:20px;color:var(--text-2)}
.think summary,.think .think-head{list-style:none;display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 2px;border-radius:8px;color:var(--text-2)}
.think summary{cursor:pointer}
.think .think-head{padding-left:2px}
.think summary::-webkit-details-marker{display:none}
.think summary:hover{color:var(--text)}
.think summary svg{width:16px;height:16px;transition:transform .15s}
.think[open] summary svg{transform:rotate(90deg)}
.think .live{background:linear-gradient(90deg,var(--text-3) 0%,var(--text) 45%,var(--text-3) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.8s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.think-body{margin:6px 0 2px 7px;padding:2px 0 2px 16px;border-left:1px solid var(--border-2);color:var(--text-2);font-size:14px;line-height:22px}
.think-body.md p{margin:0 0 .7em}
.arts{display:flex;flex-direction:column;gap:8px;margin:2px 0 14px}
.art{display:flex;align-items:center;gap:12px;width:100%;max-width:460px;padding:8px;border:1px solid var(--border);border-radius:16px;background:var(--surface);text-align:left;cursor:pointer;transition:background .15s}
.md .art{margin:1em 0}
.art:hover{background:var(--hover)}
.art .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--hover-2);color:var(--text);flex:none}
.art .ico svg{width:20px;height:20px}
.art .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.art b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art small{color:var(--text-3);font-size:12px}
.art .dl{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);flex:none}
.art .dl:hover{background:var(--hover);color:var(--text)}
.art .dl svg{width:20px;height:20px}
.art.off{cursor:default;opacity:.75}
.art.off:hover{background:var(--surface)}
.art.on{border-color:var(--text-2)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:14px;height:28px}
.thinking .wave{display:flex;align-items:flex-end;gap:2px;height:14px}
.thinking .wave i{width:3px;border-radius:2px;background:var(--text);animation:wave 1s ease-in-out infinite}
.thinking .wave i:nth-child(1){height:5px;animation-delay:0s}.thinking .wave i:nth-child(2){height:8px;animation-delay:.1s}.thinking .wave i:nth-child(3){height:11px;animation-delay:.2s}.thinking .wave i:nth-child(4){height:14px;animation-delay:.3s}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}
.caret::after{content:"";display:inline-block;width:10px;height:10px;margin-left:4px;vertical-align:baseline;border-radius:50%;background:var(--text);animation:pulse .9s ease-in-out infinite}
.note{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:14px;line-height:20px}
.note.err{background:var(--danger-soft);color:var(--danger-text)}
.note.soft{background:var(--hover);color:var(--text-2)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.foot{display:flex;align-items:center;margin:4px 0 0 -8px;min-height:32px;color:var(--text-3);font-size:12px;line-height:16px;opacity:0;transition:opacity .15s}
.msg.bot:hover .foot,.msg.bot:focus-within .foot,.msg.bot:last-child .foot{opacity:1}
.foot .lbl{margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- the preview panel, like ChatGPT's canvas */
.panel{grid-column:3;display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;height:100dvh;background:var(--surface);border-left:1px solid var(--border)}
.p-head{flex:none;display:flex;align-items:center;gap:4px;height:52px;padding:0 8px 0 16px;border-bottom:1px solid var(--border-0)}
.p-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.p-title b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title small{color:var(--text-3);font-size:12px}
.tabs{display:inline-flex;padding:2px;border-radius:999px;background:var(--seg);margin-right:4px}
.tabs button{height:28px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--text-2)}
.tabs button.on{background:var(--seg-on);color:var(--text);box-shadow:var(--shadow-s)}
.p-body{flex:1;min-height:0;overflow:auto;position:relative;background:var(--surface-2)}
.p-body iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.p-img{display:grid;place-items:center;min-height:100%;padding:24px;background:repeating-conic-gradient(var(--surface-3) 0 25%,var(--surface-2) 0 50%) 0 0/22px 22px}
.p-img img{max-width:100%;height:auto;border-radius:6px;box-shadow:var(--shadow)}
.p-doc{max-width:740px;margin:0 auto;padding:26px 30px 48px;font-size:16px;line-height:28px;background:var(--surface);min-height:100%}
.p-code{margin:0;min-height:100%;padding:16px 18px;background:var(--code);font-family:var(--mono);font-size:14px;line-height:1.5;white-space:pre;tab-size:2}
.p-code code{font-family:inherit}
.p-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;padding:24px;color:var(--text-3);text-align:center}

/* ---- buttons, and the message box: one row (+, the text, the tool pills, send) that grows to two when the text wraps or files are attached */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9999px;font-weight:500;font-size:14px;line-height:20px;text-decoration:none;white-space:nowrap;color:var(--text)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.primary:hover{background:var(--btn-hover)}
.btn.ghost{border:1px solid var(--border-2);background:transparent;color:var(--text)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger:hover{background:color-mix(in oklab,var(--danger) 88%,#000)}
.btn.danger-ghost{color:var(--danger-text);border:1px solid color-mix(in oklab,var(--danger) 40%,transparent)}
.btn.danger-ghost:hover{background:var(--danger-soft)}
.btn[disabled]{opacity:.5;cursor:default;pointer-events:none}
.dock{flex:none;position:relative;padding:0 16px env(safe-area-inset-bottom)}
.dock-wrap{position:relative;width:100%;max-width:784px;margin:0 auto}
/* the conversation fades out above the message box, rather than being cut off at its edge */
.main:not(.is-empty) .dock-wrap::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:24px;background:linear-gradient(to bottom,transparent,var(--surface));pointer-events:none}
.hero{display:none;width:100%;max-width:784px;margin:0 auto 32px;padding:0 8px;text-align:center}
.hero h1{margin:0;font-size:24px;line-height:32px;font-weight:400;letter-spacing:-.01em}
.hero p{margin:12px 0 0;color:var(--text-2);font-size:14px;line-height:20px}
.hero p:empty{display:none}
.hero code{font-family:var(--mono);font-size:.875em;font-weight:500;background:var(--inline);box-shadow:inset 0 0 0 1px var(--inline-ring);padding:1px .3rem;border-radius:4px}
.hero a{color:var(--link)}
.main.is-empty .thread{display:none}
.main.is-empty .dock{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:calc(6vh + 56px);overflow-y:auto}
.main.is-empty .hero{display:block}
/* under the empty box, like ChatGPT's "Write or edit" and "Search the web" */
.sugg{display:none;flex-direction:column;gap:4px;margin:28px 0 0;padding:0}
.main.is-empty .sugg{display:flex}
.sugg button{display:flex;align-items:center;gap:16px;min-height:48px;padding:0 16px;border-radius:12px;font-size:16px;line-height:24px;color:var(--text-2);text-align:left}
.sugg button:hover{background:var(--hover);color:var(--text)}
.sugg svg{width:20px;height:20px;color:var(--text-3)}
.main.is-empty .legal{display:none}
.composer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"lead main trail";align-items:center;column-gap:4px;min-height:52px;padding:8px;border-radius:26px;background:var(--composer);box-shadow:var(--composer-edge);cursor:text;transition:box-shadow .15s}
.composer.tall{grid-template-areas:"chips chips chips" "main main main" "lead . trail";row-gap:8px}
.composer.drag{box-shadow:0 0 0 2px var(--accent)}
.composer.disabled{opacity:.55;pointer-events:none}
.chips{grid-area:chips;display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.composer textarea{grid-area:main;display:block;width:100%;min-width:0;min-height:24px;max-height:25dvh;margin:0;padding:0 4px;border:0;outline:0;background:none;resize:none;font-size:16px;line-height:24px;overflow-y:auto}
.composer.tall textarea{padding:4px 6px 0}
.composer textarea::placeholder{color:var(--ph)}
.c-lead{grid-area:lead;display:flex;align-items:center;gap:4px;min-width:0}
.c-trail{grid-area:trail;display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.c-icon{width:36px;height:36px;border-radius:9999px;display:grid;place-items:center;color:var(--text);flex:none;cursor:pointer}
.c-icon:hover{background:var(--hover-2)}
.c-icon svg,.send svg{width:20px;height:20px}
/* a tool pill, like ChatGPT's: the permission mode */
.c-pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:9999px;font-size:15px;line-height:20px;color:var(--text-2);white-space:nowrap;flex:none;cursor:pointer;min-width:0}
.c-pill svg{width:20px;height:20px}
.c-pill:hover,.c-pill[aria-expanded="true"]{background:var(--hover-2);color:var(--text)}
.c-pill>span{overflow:hidden;text-overflow:ellipsis}
.c-pill .sub{color:var(--text-3)}
.c-pill[aria-pressed="false"]{color:var(--text-2)}
.c-pill[aria-pressed="false"]:hover{background:var(--hover-2);color:var(--text)}
.ring{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--text-2);flex:none}
.ring:hover,.ring[aria-expanded="true"]{background:var(--hover-2)}
.ring svg{width:20px;height:20px;transform:rotate(-90deg)}
.ring .trk{stroke:var(--border-2)}
.ring .bar{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .35s}
.ring.mid{color:var(--warn)}
.ring.high{color:var(--danger)}
.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none;transition:background .15s,color .15s,opacity .15s}
.send:hover{opacity:.88}
.send[disabled]{background:var(--accent);color:#fff;opacity:1;cursor:default}
.c-note{margin:0 auto 8px;padding:0 12px;color:var(--text-3);font-size:12px;line-height:16px;text-align:center}
.c-note:empty{display:none}
.c-note.warn{color:var(--warn)}
.note-link{color:var(--link);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.note-link[disabled]{opacity:.6;cursor:progress}
.legal{min-height:32px;display:flex;align-items:center;justify-content:center;margin:0 auto;padding:8px;color:var(--text-2);font-size:12px;line-height:16px;text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1}
.jump{position:absolute;left:50%;bottom:calc(100% + 12px);z-index:3;transform:translateX(-50%);width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;box-shadow:0 4px 8px -2px rgba(0,0,0,.08);color:var(--text)}
.jump svg{width:20px;height:20px}
.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:8px;width:max-content;max-width:min(560px,calc(100vw - 32px));padding:8px 12px;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-size:14px;line-height:20px;box-shadow:var(--shadow);animation:toast .35s cubic-bezier(.19,1,.22,1)}
@keyframes toast{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.banner{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(4px)}
.banner div{text-align:center;max-width:380px;padding:24px}
.banner h2{margin:0 0 6px;font-size:20px;line-height:28px;font-weight:600}
.banner p{margin:0 0 16px;color:var(--text-2)}

/* ---- something on the computer waiting for you: a question from the site's assistant, or a window of the Claude app. Only
   that window shows, over the darkened page, like a remote desktop of just it. */
.remote{position:fixed;inset:0;z-index:96;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.5);animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rwin{width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--elevated);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);animation:pop .35s cubic-bezier(.19,1,.22,1)}
.rbar{flex:none;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-bottom:1px solid var(--border-0);font-size:13px;color:var(--text-2)}
.rdots{display:flex;gap:7px}.rdots i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.rdots i:nth-child(2){background:#febc2e}.rdots i:nth-child(3){background:#28c840}
.rname{flex:1;text-align:center;margin-right:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbody{padding:20px;overflow:auto}
.rbody h3{margin:0 0 12px;font-size:18px;font-weight:600;line-height:26px}
.rbody pre{margin:0 0 16px;padding:12px 16px;max-height:42vh;overflow:auto;background:var(--code);border-radius:12px;font:13px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.rnote{margin:0 0 16px;color:var(--text-2);font-size:14px;line-height:20px}
.rbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

/* ---- the file browser: the working folder on the computer, over the whole page. Folders and files on the left, the one
   picked on the right; on a phone, one then the other. */
.files{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:var(--surface);color:var(--text);animation:fade .15s ease-out}
.fb-head{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;height:56px;padding:0 8px 0 12px;border-bottom:1px solid var(--border-0)}
.fb-title{min-width:0;display:flex;align-items:center;gap:8px}
.fb-tools{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.fb-title h2{margin:0;font-size:18px;line-height:28px;font-weight:600;white-space:nowrap}
.crumbs{display:flex;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{flex:none;max-width:240px;height:32px;padding:0 8px;border-radius:8px;font-size:14px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs button:hover{background:var(--hover);color:var(--text)}
.crumbs button[aria-current]{color:var(--text);font-weight:500}
.crumbs .sep{flex:none;display:grid;color:var(--text-3)}
.crumbs .sep svg{width:14px;height:14px}
.fb-head .icon-btn[aria-pressed="true"]{background:var(--select)}
.fb-head svg,.fb-vhead svg{width:20px;height:20px}
.fb-main{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(300px,380px) minmax(0,1fr);grid-template-areas:"places side view"}
.fb-places{grid-area:places;display:flex;flex-direction:column;gap:1px;padding:8px;border-right:1px solid var(--border-0);overflow:auto;min-height:0}
.fb-places .mh{padding:8px 10px 6px}
.fb-place{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:10px;color:var(--nav);text-align:left;font-size:14px;line-height:20px;white-space:nowrap;flex:none}
.fb-place span{overflow:hidden;text-overflow:ellipsis}
.fb-place:hover{background:var(--hover);color:var(--text)}
.fb-place.on{background:var(--select);color:var(--text)}
.fb-place svg{width:18px;height:18px}
.fb-side{grid-area:side}
.fb-view{grid-area:view}
.fb-edit{display:block;width:100%;height:100%;margin:0;padding:16px 20px;border:0;outline:0;resize:none;background:var(--code);color:var(--text);font:14px/1.6 var(--mono);tab-size:2;white-space:pre;overflow:auto}
.fb-vhead .btn{height:32px;padding:0 14px;font-size:13px;margin-left:4px}
.fb-side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border-0)}
.fb-list{flex:1;min-height:0;overflow-y:auto;padding:6px;overscroll-behavior:contain}
.fb-foot{flex:none;padding:8px 16px;border-top:1px solid var(--border-0);color:var(--text-3);font-size:12px;line-height:16px}
.fb-foot:empty{display:none}
.fb-row{display:flex;align-items:center;gap:2px;border-radius:10px}
.fb-row:hover{background:var(--hover)}
.fb-row.on{background:var(--select)}
.fb-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 4px 6px 8px;text-align:left;color:var(--text)}
.fb-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--hover-2);color:var(--text-2);flex:none}
.fb-ico svg{width:18px;height:18px}
.fb-ico.k-folder{color:var(--accent)}
.fb-ico.k-image{color:var(--hl-4)}
.fb-ico.k-audio{color:var(--hl-5)}
.fb-ico.k-video{color:var(--hl-1)}
.fb-ico.k-pdf{color:var(--danger-text)}
.fb-ico.k-text{color:var(--hl-3)}
.fb-open .tx{min-width:0;display:flex;flex-direction:column}
.fb-open b{font-weight:400;font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-open small{color:var(--text-3);font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-row .icon-btn{width:32px;height:32px;margin-right:6px;color:var(--text-2);opacity:0}
.fb-row .icon-btn svg{width:18px;height:18px}
.fb-row:hover .icon-btn,.fb-row:focus-within .icon-btn,.fb-row.on .icon-btn{opacity:1}
.fb-row .icon-btn:hover{color:var(--danger-text);background:var(--danger-soft)}
.fb-view{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface-2)}
.fb-vhead{flex:none;display:flex;align-items:center;gap:4px;height:56px;padding:0 8px 0 20px;border-bottom:1px solid var(--border-0);background:var(--surface)}
.fb-vhead:empty{display:none}
.fb-vhead .danger:hover{color:var(--danger-text);background:var(--danger-soft)}
.fb-vbody{flex:1;min-height:0;overflow:auto;position:relative}
.fb-vbody iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.fb-vbody .p-img{height:100%;min-height:0}
.fb-vbody .p-img img{max-height:100%;object-fit:contain}
.fb-media{display:grid;place-items:center;min-height:100%;padding:32px 24px}
.fb-media video{display:block;max-width:100%;max-height:calc(100dvh - 190px);border-radius:12px;background:#000;box-shadow:var(--shadow)}
/* the page's own audio player */
.player{display:flex;flex-direction:column;align-items:center;width:min(460px,100%);padding:28px 24px 22px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow-s);text-align:center}
.player audio{display:none}
.pl-art{width:96px;height:96px;border-radius:22px;margin-bottom:18px}
.pl-art svg{width:44px;height:44px}
.pl-name{max-width:100%;font-weight:600;font-size:16px;line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-sub{color:var(--text-3);font-size:12px;line-height:16px;margin-top:2px}
.pl-bar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:10px;width:100%;margin-top:20px}
.pl-t{font-size:12px;line-height:16px;color:var(--text-2);font-variant-numeric:tabular-nums}
.pl-t:first-child{text-align:right}
.pl-t:last-child{text-align:left}
.player input[type=range]{--p:0%;-webkit-appearance:none;appearance:none;width:100%;height:16px;margin:0;background:none;cursor:pointer}
.player input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--text) var(--p),var(--border-2) var(--p))}
.player input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--text) var(--p),var(--border-2) var(--p))}
.player input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border-radius:50%;background:var(--text);border:0}
.player input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--text);border:0}
.pl-ctl{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:10px;width:100%;margin-top:14px}
.pl-play{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--solid);color:var(--solid-ink)}
.pl-play:hover{opacity:.88}
.pl-play svg{width:26px;height:26px}
.pl-ctl .icon-btn{width:40px;height:40px;border-radius:50%;color:var(--text-2)}
.pl-ctl .icon-btn:hover{color:var(--text)}
.pl-ctl .icon-btn svg{width:24px;height:24px}
.pl-rate{justify-self:start;min-width:44px;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}
.pl-rate:hover{background:var(--hover);color:var(--text)}
.pl-vol{justify-self:end;display:flex;align-items:center;gap:2px}
.pl-vol .icon-btn svg{width:20px;height:20px}
.pl-vol input[type=range]{width:72px}
.fb-note{margin:0;padding:8px 18px;border-bottom:1px solid var(--border-0);background:var(--surface);color:var(--text-3);font-size:12px;line-height:16px}
.fb-vbody .p-code{min-height:0}
/* narrower: the places are a row of chips over the list */
@media (max-width:1100px){
  .fb-main{grid-template-columns:minmax(280px,380px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"places view" "side view"}
  .fb-places{flex-direction:row;gap:6px;padding:8px 10px;border-right:1px solid var(--border-0);border-bottom:1px solid var(--border-0);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .fb-places .mh{display:none}
  .fb-place{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border)}
  .fb-place svg{width:16px;height:16px}
}
@media (max-width:860px){
  .fb-head{height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 4px 0 12px;grid-template-columns:minmax(0,1fr) auto}
  .fb-head .views{display:none}
  .fb-main{grid-template-columns:minmax(0,1fr);grid-template-areas:"places" "side"}
  .files.viewing .fb-main{grid-template-areas:"view";grid-template-rows:minmax(0,1fr)}
  .files.viewing .fb-places{display:none}
  .fb-head .icon-btn,.fb-vhead .icon-btn{width:40px;height:40px}
  .fb-main{grid-template-columns:minmax(0,1fr)}
  .fb-side{border-right:0}
  .files.viewing .fb-side,.files:not(.viewing) .fb-view{display:none}
  .fb-vhead{padding:0 4px}
  .fb-row .icon-btn{opacity:1}
  .fb-list,.fb-vbody{padding-bottom:env(safe-area-inset-bottom)}
}

/* ---- dialogs: Settings (tabs on the left, the close button above them), Plan usage, and the update checklist */
/* asking before something is done, in the page's own small dialog, never the browser's */
.dlg.ask{width:min(440px,calc(100vw - 24px))}
.ask-box{margin:0;padding:22px 22px 18px}
.ask-box h2{margin:0;font-size:18px;line-height:26px;font-weight:600;overflow-wrap:anywhere}
.ask-box p{margin:8px 0 0;color:var(--text-2);font-size:14px;line-height:21px;white-space:pre-line;overflow-wrap:anywhere}
.ask-box p:empty{display:none}
.ask-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.dlg{width:min(680px,calc(100vw - 24px));height:min(600px,calc(100dvh - 32px));padding:0;border:0;border-radius:16px;background:var(--elevated);color:var(--text);box-shadow:var(--shadow);overflow:hidden}
.dlg[open]{display:flex;flex-direction:column;animation:pop .35s cubic-bezier(.19,1,.22,1)}
.dlg.small{width:min(480px,calc(100vw - 24px));height:fit-content;max-height:calc(100dvh - 32px)}
.dlg.compact{width:min(560px,calc(100vw - 24px));height:fit-content;max-height:calc(100dvh - 32px)}
.dlg.compact .dlg-body{flex:none}
.dlg a:not(.btn){color:var(--link)}
.dlg::backdrop{background:var(--scrim,rgba(0,0,0,.4))}
.dlg-head{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 12px 6px 20px}
.dlg-head h2{margin:0;padding-top:4px;font-size:18px;font-weight:600;line-height:28px}
.dlg-head p{margin:0;color:var(--text-3);font-size:13px;line-height:18px}
.dlg-head p:empty{display:none}
.dlg-body{flex:1;min-height:0;overflow-y:auto;padding:8px 20px 20px;overscroll-behavior:contain}
.dlg.small .dlg-body{flex:none}
#setDlg:not(.compact) .dlg-head{display:none}
.set{display:grid;grid-template-columns:180px minmax(0,1fr);flex:1;min-height:0}
.set-nav{display:flex;flex-direction:column;padding:10px 8px;overflow-y:auto}
.set-nav .set-x{margin:0 0 6px;color:var(--text)}
.set-nav button[data-tab-set]{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:10px;font-size:14px;line-height:20px;text-align:left;color:var(--text)}
.set-nav button[data-tab-set]:hover{background:var(--hover)}
.set-nav button.on{background:var(--select)}
.set-nav button.danger{color:var(--danger-text)}
.set-nav svg{width:20px;height:20px}
.set-nav .badge{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.set-body{overflow-y:auto;padding:10px 20px 20px 12px;min-width:0;overscroll-behavior:contain}
.pane-title{margin:0;padding:4px 0 12px;font-size:18px;line-height:28px;font-weight:600;border-bottom:1px solid var(--border-0)}
.set-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:1px solid var(--border-0);background:var(--elevated)}
.set-foot .hint{margin-right:auto;color:var(--text-3);font-size:13px}
.sec{margin:0;padding:12px 0;border-bottom:1px solid var(--border-0)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 4px;font-size:14px;line-height:20px;font-weight:500}
.sec p{margin:0 0 8px;color:var(--text-2);font-size:13px;line-height:18px}
.sec .field:last-child,.sec .switch:last-child{margin-bottom:0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:36px}
.srow h3,.sec.srow h3{margin:0}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.field label{font-size:14px;line-height:20px;font-weight:500}
.field small{color:var(--text-3);font-size:12px;line-height:16px}
.input{width:100%;height:40px;padding:0 12px;border:1px solid var(--border-2);border-radius:10px;background:transparent;outline:none}
.input:focus{border-color:var(--text-3)}
.input.bad{border-color:var(--danger)}
.input-row{display:flex;align-items:center;border:1px solid var(--border-2);border-radius:10px;background:transparent;overflow:hidden}
.input-row:focus-within{border-color:var(--text-3)}
.input-row input{flex:1;min-width:0;height:40px;padding:0 8px 0 12px;border:0;background:none;outline:none}
.input-row span{color:var(--text-3);padding-right:12px;white-space:nowrap;font-size:13px}
.switch{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:8px 0;margin:0 0 4px}
.switch .t{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:20px}
.switch .t small{color:var(--text-3);font-size:12px;line-height:16px;max-width:420px}
.toggle{position:relative;width:32px;height:20px;border-radius:999px;background:var(--toggle-off);flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--toggle)}
.toggle[aria-checked="true"]::after{transform:translateX(12px)}
.toggle[disabled]{opacity:.5;cursor:default}
.img-field{display:flex;align-items:center;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.img-prev{width:48px;height:48px;border-radius:12px;border:1px solid var(--border);display:grid;place-items:center;background:var(--surface-2);overflow:hidden;flex:none}
.img-prev img,.img-prev svg{width:100%;height:100%;object-fit:contain}
.img-meta{flex:1;min-width:0}
.img-meta b{display:block;font-weight:500;font-size:14px}
.img-meta small{color:var(--text-3);font-size:12px}
.seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--seg)}
.seg button{height:28px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--text-2);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--seg-on);color:var(--text);box-shadow:var(--shadow-s)}
.seg button[disabled]{cursor:default}
.kv{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--hover);font-size:13px}
.kv span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12.5px;color:var(--text-2)}
.kv .btn{height:30px;padding:0 12px;font-size:13px}
.danger-zone{padding:12px 0 0}
.danger-zone h3{margin:0 0 4px;font-size:14px;line-height:20px;font-weight:500;color:var(--danger-text)}
.danger-zone p{margin:0 0 8px;color:var(--text-2);font-size:13px;line-height:18px}
.warn-list{margin:8px 0 12px;padding-left:1.2em;color:var(--text-2);font-size:13px;line-height:18px}
.warn-list li{margin:.25em 0}
.err-text{color:var(--danger-text);font-size:13px;margin-top:6px}
.fine{margin:12px 0 0;color:var(--text-3);font-size:12px;line-height:16px}
.steps{list-style:none;margin:6px 0 4px;padding:0}
.steps li{display:flex;align-items:center;gap:12px;padding:7px 2px;color:var(--text-3)}
.steps .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--border-2);flex:none}
.steps .ic svg{width:13px;height:13px}
.steps li.active{color:var(--text);font-weight:500}
.steps li.active .ic{border-color:var(--text)}
.steps li.done{color:var(--text-2)}
.steps li.done .ic{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.steps li.error{color:var(--danger-text);font-weight:500}
.steps li.error .ic{border-color:var(--danger);color:var(--danger)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--border-2);border-top-color:var(--text);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.notes{margin:0 0 4px;padding-left:1.2em;color:var(--text-2)}
.notes li{margin:.25em 0}
.earlier{margin-top:16px}
.earlier summary{cursor:pointer;color:var(--text-2);font-size:13px}
.earlier .rel{margin-top:12px}
.earlier .rel h3{margin:0 0 4px;font-size:13px}
.what{display:flex;flex-direction:column;gap:6px;margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--hover);color:var(--text-2);font-size:13px;line-height:18px}
.what div{display:flex;gap:8px}
.what svg{width:16px;height:16px;margin-top:1px;color:var(--text)}
.vrow{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:15px}
.vrow b{font-weight:600}
.vrow svg{width:16px;height:16px;color:var(--text-3)}
.linkbox{display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--hover);font-family:var(--mono);font-size:12.5px;color:var(--text-2)}
.linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.howto{margin:14px 0 0;padding:14px 16px 14px 34px;border-radius:12px;background:var(--hover);color:var(--text-2);font-size:13px;line-height:19px}
.howto li{margin:0 0 8px;padding-left:4px}
.howto li:last-child{margin:0}
.howto b{color:var(--text);font-weight:600}
.howto code,.sec code,.fine code,.dlg-body code,.field code{font-family:var(--mono);font-size:.875em;font-weight:500;background:var(--inline);box-shadow:inset 0 0 0 1px var(--inline-ring);padding:1px .3rem;border-radius:4px;color:var(--text)}
.wait{display:flex;align-items:center;gap:10px;margin:14px 0 0;color:var(--text-2);font-size:13px}
.meters{display:flex;flex-direction:column;gap:20px}
.mt-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.mt-top b{font-weight:500;font-size:14px}
.mt-top span{color:var(--text-2);font-size:14px}
.mt-bar{height:8px;border-radius:999px;background:var(--hover-2);overflow:hidden}
.mt-bar i{display:block;height:100%;border-radius:999px;background:var(--text);min-width:2px;transition:width .4s ease}
.mt-bar.hot i{background:var(--warn)}
.mt-bar.full i{background:var(--danger)}
.mt-sub{margin-top:6px;color:var(--text-3);font-size:12px;line-height:16px}
.ok-text{color:var(--ok);font-weight:500}
.field .seg{align-self:flex-start;max-width:100%;overflow-x:auto}
.prog{margin:2px 0 6px}
.prog-step{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;font-weight:500}
.prog-step small{margin-left:auto;color:var(--text-3);font-weight:400;font-size:13px}
.credits{margin-top:20px;padding-top:16px;border-top:1px solid var(--border-0)}
.credits p{margin:0 0 12px;color:var(--text-2);font-size:13px;line-height:18px}
.reset-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 0}
.reset-row .t{display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0}
.reset-row small{color:var(--text-3);font-size:12px;line-height:16px}
.reset-row .btn{height:32px;padding:0 14px;font-size:13px;flex:none}
.bal{display:flex;flex-direction:column;gap:6px;margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--hover);font-size:13px}
.bal div{display:flex;justify-content:space-between;gap:12px}
.bal span{color:var(--text-2)}
.bal b{font-weight:500;text-align:right}
.state{font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--hover-2);color:var(--text-2)}
.state.using,.state.on{background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ok)}
.state.near{background:var(--warn-soft);color:var(--warn)}
.state.out{background:var(--danger-soft);color:var(--danger-text)}
@media (max-width:1280px) and (min-width:861px){
  .app.panel-open{--side-w:0px}
  .app.panel-open .side{display:none}
  .app.panel-open{--panel-w:min(55vw,860px)}
}

@media (max-width:860px){
  .app,.app.side-collapsed,.app.panel-open{grid-template-columns:minmax(0,1fr)}
  .main{grid-column:1}
  .panel{position:fixed;inset:0;z-index:55;border-left:0;padding-top:env(safe-area-inset-top)}

  .only-wide{display:none}

  .top .icon-btn{width:40px;height:40px}

  .pill.solo{width:40px;padding:0;justify-content:center}
  .thread-inner{padding:0 16px 24px}
  .dock{padding:0 24px env(safe-area-inset-bottom)}
  .hero h1{font-size:24px;line-height:30px}
  .nav-item kbd{display:none}
  .dlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0}
  .dlg.small,.dlg.compact{height:fit-content;max-height:92dvh;border-radius:16px 16px 0 0;margin:auto 0 0;width:100vw}
  #setDlg:not(.compact) .dlg-head{display:flex}
  .set-nav .set-x{display:none}
  .set{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .set-nav{flex-direction:row;overflow-x:auto;gap:2px;padding:4px 12px 8px;border-bottom:1px solid var(--border-0)}
  .set-nav button[data-tab-set]{flex:none;min-height:32px;padding:0 12px}
  .set-nav svg{display:none}
  .set-body{padding:4px 16px 16px}
  .pane-title{display:none}
  .set-foot{padding:10px 16px}
  .dlg-head{padding:12px 8px 6px 16px}
  .dlg-body{padding:8px 16px 16px}
}
@media (hover:none){.foot,.ufoot{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

// `pick` is a file in that folder to show; without one, what showed before stays if it's still there.
async function loadFiles(path, pick, root = F.root) {
  const seq = ++F.seq;

  F.path = path;
  F.loading = true;

    const j = await apiJson(`/api/files?root=${encodeURIComponent(root)}&path=${encodeURIComponent(path)}`);

    F.path = j.path;
    if (j.places && j.places.length) F.places = j.places;
    const name = pick !== undefined ? pick : F.sel && F.sel.name;
    const e = name ? j.entries.find(x => x.name === name && !x.dir) : null;
    F.sel = e ? { ...e, path: joinPath(j.path, e.name) } : null;

    F.code = (e.data && e.data.code) || "";

    .concat(parts.map((p, i) => `<span class="sep">${I.chev}</span><button type="button" data-fb-go="${esc(parts.slice(0, i + 1).join("/"))}"${i === parts.length - 1 ? ' aria-current="page"' : ""}>${esc(p)}</button>`)).join("");

  else if (!F.list) html = '<div class="p-empty">Loading…</div>';
  else if (!list.length) html = `<div class="p-empty"><span>${F.list.entries.length ? "Only hidden files here. The eye button at the top shows them." : "This folder is empty."}</span></div>`;
  else {

function noPreview(why, f) {
  return `<div class="p-empty"><span>${esc(why)}</span><a class="btn ghost" href="${fsUrl(f.path, true)}" download="${esc(f.name)}">${I.download}Download</a></div>`;
}
function editable(f) { return f.kind === "text" && f.size <= EDIT_MAX; }
function renderFileView() {
  const f = F.sel;

  if (!f) {
    head.innerHTML = "";
    F.shown = "";
    patchHtml(body, `<div class="p-empty">${F.list && F.list.entries.length ? "<span>Pick a file to see it here.</span>" : ""}</div>`);

  }

  patchHtml(head, `<button class="icon-btn only-narrow" type="button" data-fb="back" data-tip="Back to the folder" aria-label="Back to the folder">${I.back}</button><div class="p-title"><b>${esc(f.name)}${ed && ed.dirty ? " •" : ""}</b><small>${esc(ed ? (ed.dirty ? "Edited, not saved" : "Editing") : `${FKIND[f.kind] || "File"} · ${fmtSize(f.size)}${f.mtime ? " · " + fbWhen(f.mtime) : ""}`)}</small></div>${tools}`);
  // being edited, the editor stays as it is

  const key = `${F.root}|${f.path}|${f.size}|${f.mtime}`;
  if (key === F.shown) return;
  F.shown = key;
  const src = fsUrl(f.path) + `&v=${f.mtime || 0}`;
  if (f.kind === "image") body.innerHTML = `<div class="p-img"><img src="${src}" alt="${esc(f.name)}"></div>`;
  else if (f.kind === "audio") { body.innerHTML = playerHtml(f, src); setupPlayer(body.querySelector(".player"), key, f); return; }

// A song or any other sound plays in the page's own player, drawn like the rest of the page rather than the browser's: play and
// pause, ten seconds back and forward, a bar to drag, the time, the volume and the speed.
const RATES = [1, 1.25, 1.5, 2, 0.75];
function fmtTime(t) {
  if (!isFinite(t) || t < 0) return "0:00";
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = String(Math.floor(t % 60)).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}
function playerHtml(f, src) {
  return `<div class="fb-media"><div class="player" role="group" aria-label="${esc(`Audio player: ${f.name}`)}"><audio preload="metadata" src="${src}"></audio>` +
    `<span class="fb-ico k-audio pl-art">${I.k_audio}</span><b class="pl-name">${esc(f.name)}</b><small class="pl-sub">${esc(fmtSize(f.size))}</small>` +
    `<div class="pl-bar"><span class="pl-t" data-pl-cur>0:00</span><input class="pl-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position" data-pl-seek><span class="pl-t" data-pl-dur>0:00</span></div>` +
    `<div class="pl-ctl"><button class="pl-rate" type="button" data-pl="rate" data-tip="Speed" aria-label="Speed">1×</button>` +
    `<button class="icon-btn" type="button" data-pl="back" data-tip="Back 10 seconds" aria-label="Back 10 seconds">${I.rew}</button>` +
    `<button class="pl-play" type="button" data-pl="play" aria-label="Play">${I.play}</button>` +
    `<button class="icon-btn" type="button" data-pl="fwd" data-tip="Forward 10 seconds" aria-label="Forward 10 seconds">${I.ffw}</button>` +
    `<span class="pl-vol"><button class="icon-btn" type="button" data-pl="mute" data-tip="Mute" aria-label="Mute">${I.vol}</button><input type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" data-pl-vol></span></div></div></div>`;

function setupPlayer(root, key, f) {

  const vol = root.querySelector("[data-pl-vol]");
  const play = root.querySelector('[data-pl="play"]');

  const fill = (el, frac) => el.style.setProperty("--p", `${Math.max(0, Math.min(1, frac)) * 100}%`);
  const paint = () => {
    const d = isFinite(a.duration) ? a.duration : 0;

    root.querySelector("[data-pl-cur]").textContent = fmtTime(dragging && d ? (seek.value / 1000) * d : a.currentTime);
    root.querySelector("[data-pl-dur]").textContent = fmtTime(d);

  seek.addEventListener("change", () => { if (isFinite(a.duration)) a.currentTime = (seek.value / 1000) * a.duration; dragging = false; paint(); });
  vol.addEventListener("input", () => { a.volume = Number(vol.value); a.muted = a.volume === 0; });

    const b = e.target.closest("[data-pl]");
    if (!b) return;
    const act = b.dataset.pl;
    if (act === "play") a.paused ? a.play().catch(() => {}) : a.pause();
    else if (act === "back") a.currentTime = Math.max(0, a.currentTime - 10);
    else if (act === "fwd") a.currentTime = Math.min(a.duration || 0, a.currentTime + 10);
    else if (act === "mute") { a.muted = !(a.muted || a.volume === 0); if (!a.muted && a.volume === 0) a.volume = 1; }
    else if (act === "rate") { a.playbackRate = RATES[(RATES.indexOf(a.playbackRate) + 1) % RATES.length]; b.textContent = `${a.playbackRate}×`; }
  });

  root.addEventListener("keydown", e => { if (e.key === " " && !e.target.matches("input")) { e.preventDefault(); play.click(); } });
  paint();
}

// The start of a text file, coloured like code.
async function showText(f, key) {
  const body = $("fbVBody");
  if (!f.size) { body.innerHTML = `<div class="p-empty"><span>This file is empty.</span>${editable(f) ? `<button class="btn ghost" type="button" data-fb="edit">${I.pencil}Edit</button>` : ""}</div>`; return; }
  body.innerHTML = '<div class="p-empty">Loading…</div>';
  try {
    const r = await api(fsUrl(f.path), { headers: { range: `bytes=0-${TEXT_MAX - 1}` } });
    if (!r.ok && r.status !== 206) { const j = await r.json().catch(() => ({})); throw new Error(j.error || "Couldn't read this file."); }
    const t = new TextDecoder().decode(await r.arrayBuffer());

    if (t.slice(0, 8000).includes("\u0000")) { body.innerHTML = noPreview("This file isn't text, so it can't be shown here.", f); return; }
    const ext = ((f.name.match(/\.([A-Za-z0-9]+)$/) || [])[1] || "").toLowerCase();
    const lang = LANG[ext] || ext || "plaintext";
    const cut = f.size > TEXT_MAX ? `<p class="fb-note">Showing the first ${fmtSize(TEXT_MAX)} of ${fmtSize(f.size)}. ${editable(f) ? "Edit shows all of it." : "Download it to see all of it."}</p>` : "";
    body.innerHTML = `${cut}<pre class="p-code"><code class="language-${esc(lang)}">${esc(t)}</code></pre>`;

// Editing: the whole file, as text. Saved only if it hasn't changed on the computer since it was opened here, unless you
// say to save over it. Line endings stay as the file had them.
async function startEdit() {
  const f = F.sel;
  if (!f || !editable(f) || F.edit) return;
  const ed = { root: F.root, path: f.path, mtime: f.mtime, orig: "", crlf: false, dirty: false, loading: true, saving: false };
  F.edit = ed;
  renderFileView();
  const body = $("fbVBody");
  body.innerHTML = '<div class="p-empty">Loading…</div>';
  let text;
  try {
    const r = await api(fsUrl(f.path) + `&v=${f.mtime || 0}`);
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || "Couldn't read this file."); }
    text = new TextDecoder("utf-8", { fatal: true, ignoreBOM: true }).decode(await r.arrayBuffer());
    if (text.includes("\u0000")) throw new Error("This file isn't text, so it can't be edited here.");
  } catch (e) {
    if (F.edit !== ed) return;
    F.edit = null;
    F.shown = "";
    toast(e instanceof TypeError ? "This file isn't plain text (UTF-8), so it can't be edited here." : e.message === "Signed out" ? "Sign in again to edit this file." : e.message);
    renderFileView();
    return;
  }
  if (F.edit !== ed) return;
  ed.orig = text;
  ed.crlf = /\r\n/.test(text);
  ed.loading = false;
  body.innerHTML = `<textarea class="fb-edit" id="fbEdit" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="${esc(`Edit ${f.name}`)}"></textarea>`;
  const ta = $("fbEdit");
  ta.value = text;
  ta.addEventListener("input", () => { const d = ta.value !== ed.orig.replace(/\r\n/g, "\n"); if (d !== ed.dirty) { ed.dirty = d; renderFileView(); } });
  ta.addEventListener("keydown", e => { if ((MAC ? e.metaKey : e.ctrlKey) && (e.key || "").toLowerCase() === "s") { e.preventDefault(); saveEdit(); } });
  renderFileView();
  ta.focus();
}
async function cancelEdit() {
  if (!(await leaveEdit())) return;
  renderFileView();
}
async function saveEdit(force) {
  const ed = F.edit;
  const ta = $("fbEdit");
  if (!ed || ed.saving || ed.loading || !ta) return;
  const text = ed.crlf ? ta.value.replace(/\r?\n/g, "\r\n") : ta.value;
  ed.saving = true;
  renderFileView();
  try {
    const r = await apiJson("/api/files/write", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ root: ed.root, path: ed.path, text, mtime: ed.mtime, force: !!force }) });
    if (F.edit !== ed) return;
    F.edit = null;
    F.shown = "";
    const name = baseOf(ed.path);
    if (F.sel && F.sel.path === ed.path) Object.assign(F.sel, { size: r.size, mtime: r.mtime });
    const row = F.list && F.list.entries.find(x => x.name === name);
    if (row) Object.assign(row, { size: r.size, mtime: r.mtime });
    toast(`Saved "${name}".`);
    renderFiles();
  } catch (e) {
    ed.saving = false;
    renderFileView();
    if (e.data && e.data.code === "changed" && (await askConfirm({ title: `"${baseOf(ed.path)}" changed on your computer`, text: "It changed there since you opened it here. Save your version over it, or cancel and keep editing (copy your changes, then reopen it to see the other version).", ok: "Save over it", danger: true }))) return saveEdit(true);
    if (e.message !== "Signed out" && !(e.data && e.data.code === "changed")) toast(e.message);
  }
}

async function trashFile(name) {
  const e = F.list && F.list.entries.find(x => x.name === name);
  if (!e || F.busy) return;
  const path = joinPath(F.path, name);
  if (F.edit && F.edit.path === path && !(await leaveEdit())) return;
  if (!(await askConfirm({ title: `Move "${name}" to the Trash?`, text: `${e.dir ? "The folder and everything in it go" : "It goes"} to the Trash on your computer (the Recycle Bin on Windows). It isn't deleted: you can put it back from there.`, ok: "Move to Trash", danger: true }))) return;
  F.busy = path;
  renderFiles();
  try {
    const r = await apiJson("/api/files/trash", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ root: F.root, path }) });
    toast(`Moved "${name}" to the ${r.where}.`);
    if (F.sel && F.sel.path === path) F.sel = null;
    F.list.entries = F.list.entries.filter(x => x.name !== name);
  } catch (err) {
    if (err.message !== "Signed out") toast(err.message);
  }
  F.busy = "";
  renderFiles();
  if (F.open) loadFiles(F.path);
}

$("files").addEventListener("click", e => {
  const view = e.target.closest("[data-view]");
  if (view) { if (view.dataset.view === "chat") closeFiles(); return; }
  const place = e.target.closest("[data-fb-place]");
  if (place) { leaveEdit().then(ok => ok && loadFiles("", undefined, place.dataset.fbPlace)); return; }
  const go = e.target.closest("[data-fb-go]");
  if (go) { leaveEdit().then(ok => ok && loadFiles(go.dataset.fbGo)); return; }
  const open = e.target.closest("[data-fb-open]");
  if (open) {
    const x = F.list && F.list.entries.find(y => y.name === open.dataset.fbOpen);
    if (!x) return;
    const p = joinPath(F.path, x.name);
    if (F.edit && F.edit.path === p) return;
    leaveEdit().then(ok => {
      if (!ok) return;
      if (x.dir) return loadFiles(p);
      F.sel = { ...x, path: p };
      renderFiles();
    });
    return;
  }
  const tr = e.target.closest("[data-fb-trash]");
  if (tr) return trashFile(tr.dataset.fbTrash);
  const b = e.target.closest("[data-fb]");
  if (!b) return;
  const act = b.dataset.fb;
  if (act === "close") closeFiles();
  else if (act === "refresh") loadFiles(F.path);
  else if (act === "back") leaveEdit().then(ok => { if (ok) { F.sel = null; renderFiles(); } });
  else if (act === "trash" && F.sel) trashFile(F.sel.name);
