$("cNote").addEventListener("click", async e => {
  const r = e.target.closest("[data-reset]");
  if (r) useReset(r);
});
// a time of day, or a day and time when it's further off
function clock(sec) {
  const d = new Date(sec * 1000);
  const soon = sec - Date.now() / 1000 < 20 * 3600;
  return d.toLocaleString(undefined, soon ? { hour: "numeric", minute: "2-digit" } : { weekday: "short", hour: "numeric", minute: "2-digit" });
}

/* ---------- settings: name, look, address, updates, delete; and the checklist for whatever is running ---------- */
const NAME_OK = /^[A-Za-z0-9][A-Za-z0-9 ._-]{0,39}$/;
const SLUG_OK = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/;
const SET = { tab: "general", name: undefined, saving: "", saved: "", address: "", confirm: "", err: "", busy: false, justUpdated: false };
const TABS = [["general", "General", I.gear], ["appearance", "Appearance", I.image], ["address", "Address", I.globe], ["updates", "Updates", I.upgrade], ["delete", "Delete site", I.trash]];

// Every setting here takes effect when it's changed: no Save button. Only a name being typed is held, until Enter or leaving
// the field.
// Right after an update the site can answer as the version before for a few seconds, which doesn't know these yet.
function switching(e) {
  return e.message === "Not found" || (e.data && e.data.code === "restarting") ? `${CFG.name} is still switching to its new version. Try again in a few seconds.` : e.message;
}
function nameTyped() { return SET.name === undefined ? CFG.name : SET.name.trim().replace(/\s+/g, " "); }
function isDirty() { return SET.name !== undefined && nameTyped() !== CFG.name; }
function draftError() {
  return NAME_OK.test(nameTyped()) ? "" : "Use up to 40 letters, numbers, spaces, dots, dashes or underscores, starting with a letter or number.";
}
function hostParts() {
  const parts = location.hostname.split(".");
  return { name: parts[0], suffix: parts.length > 1 ? "." + parts.slice(1).join(".") : "" };
}

function openSettings(tab) {
  if (tab) SET.tab = tab;
  if (!$("setDlg").open) $("setDlg").showModal();
  renderSettings();
  pollUpdate();
}
function closeSettings() { $("setDlg").close(); }
$("setDlg").addEventListener("close", () => { SET.justUpdated = false; });

function renderSettings() {
  const run = upRun();
  $("setDlg").classList.toggle("compact", !!(run || UP.gone));
  // never a trap: whatever is running keeps going if this is closed, and the pill in the top bar opens it again
  $("setClose").style.display = "";
  if (run || UP.gone) return renderJob();
  const u = UP.data;
  $("setTitle").textContent = "Settings";
  $("setSub").textContent = location.host;
  // as in ChatGPT: the close button above the tabs, and the section's name at the top of it
  const nav = TABS.map(([k, label, ic]) => `<button type="button" data-tab-set="${k}" class="${SET.tab === k ? "on" : ""}${k === "delete" ? " danger" : ""}"${SET.tab === k ? ' aria-current="page"' : ""}>${ic}<span>${label}</span>${k === "updates" && updateAvailable(u) ? '<i class="badge"></i>' : ""}</button>`).join("");
  const name = (TABS.find(([k]) => k === SET.tab) || TABS[0])[1];
  patchHtml($("setBody"), `<div class="set"><nav class="set-nav" aria-label="Settings sections"><button type="button" class="icon-btn set-x" data-act="hide" aria-label="Close settings">${I.x}</button>${nav}</nav><div class="set-body" id="setPane"><h2 class="pane-title">${name}</h2>${paneHtml()}</div></div>`);
  renderFoot();
}

function blockedNote() {
  const b = UP.data && UP.data.blockedAdmin;
  return b ? `<div class="note soft" style="margin:0 0 16px">${esc(b.message)}</div>` : "";
}
function imgField(key, label, hint) {
  const site = siteNow();
  const own = !!site[key];
  const prev = `<img src="/favicon?v=${esc(site.v)}" alt="">`;
  const state = SET.saving === key ? "Saving…" : own ? "Your own" : "Built-in";
  return `<div class="img-field"><div class="img-prev">${prev}</div><div class="img-meta"><b>${label}</b><small>${state} · ${hint}</small></div><button type="button" class="btn ghost" data-img="${key}"${SET.saving ? " disabled" : ""}>Choose…</button>${own ? `<button type="button" class="btn ghost" data-img-reset="${key}"${SET.saving ? " disabled" : ""}>Built-in</button>` : ""}</div>`;
}

// The text in the browser tab, next to the tab icon: the site's name unless it's given its own.
function tabField() {
  const status = SET.saving === "tab" ? "Saving…" : SET.saved === "tab" ? "Saved" : "";
  return `<div class="field"><label for="fTab">Tab title</label><input class="input" id="fTab" maxlength="60" value="${esc(SET.tabTitle === undefined ? CFG.tab : SET.tabTitle)}" placeholder="${esc(CFG.name)}" autocomplete="off" enterkeyhint="done"><small>The text next to the tab icon in the browser. Leave it empty to use the site's name. Saved when you press Enter or click away.${status ? ` <b class="ok-text">${status}</b>` : ""}</small></div>`;
}
function saveTab() {
  if (SET.tabTitle === undefined || SET.saving) return;
  const t = SET.tabTitle.trim().replace(/\s+/g, " ");
  if (t === CFG.tab) { SET.tabTitle = undefined; return; }
  saveSite("tab", { tab: t });
}

function paneHtml() {
  const u = UP.data;
  if (SET.tab === "general") {
    const status = SET.saving === "name" ? "Saving…" : SET.saved === "name" ? "Saved" : "";
    return `<div class="sec"><div class="field"><label for="fName">Site name</label><input class="input${draftError() ? " bad" : ""}" id="fName" maxlength="40" value="${esc(SET.name === undefined ? CFG.name : SET.name)}" autocomplete="off" enterkeyhint="done"><small>Shown at the top of the page and in the browser tab (unless it has its own title, in Appearance). Saved when you press Enter or click away. The command on your computer is the name too: <code>${esc(CFG.command)}</code>, renamed to match when the name changes.${status ? ` <b class="ok-text">${status}</b>` : ""}</small>${draftError() ? `<div class="err-text">${esc(draftError())}</div>` : ""}</div>${SET.err && SET.tab === "general" ? `<div class="err-text">${esc(SET.err)}</div>` : ""}</div>${computerHtml()}`;
  }
  if (SET.tab === "appearance") {
    const curTheme = store.get("theme", "system");
    return `<div class="sec"><h3>Branding</h3><p>PNG, JPEG, GIF, WebP, ICO or SVG, up to 512 KB. A new one is used as soon as you pick it.</p>${imgField("favicon", "Tab icon", "the browser tab and the collapsed sidebar")}${tabField()}${SET.err && SET.tab === "appearance" ? `<div class="err-text">${esc(SET.err)}</div>` : ""}<input type="file" id="fImg" accept="image/*,.ico,.svg" hidden></div><div class="sec srow"><h3>Theme</h3><div class="seg" role="group" aria-label="Theme">${THEMES.map(([k, label]) => `<button type="button" data-theme-set="${k}" class="${k === curTheme ? "on" : ""}" aria-pressed="${k === curTheme}">${label}</button>`).join("")}</div></div>`;
  }
  if (SET.tab === "address") {
    const h = hostParts();
    const bad = SET.address && !SLUG_OK.test(SET.address);
    return `${blockedNote()}<div class="sec"><h3>Current address</h3><div class="kv"><span>${esc(location.origin)}</span><button type="button" class="btn ghost" data-copy-link="${esc(location.origin)}">${I.copy}<span>Copy</span></button></div></div><div class="sec"><h3>Change the address</h3><p>This is the name in the web address. You'll get a new link; the old one stops working.</p><div class="field"><div class="input-row"><input id="fAddr" value="${esc(SET.address)}" placeholder="${esc(h.name)}" maxlength="63" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="New address"><span>${esc(h.suffix)}</span></div>${bad ? '<div class="err-text">Use lowercase letters, numbers and dashes, starting and ending with a letter or number.</div>' : ""}${SET.err ? `<div class="err-text">${esc(SET.err)}</div>` : ""}</div><ul class="warn-list"><li>The new site is set up first. This one keeps working while you turn on Cloudflare Access for the new address.</li><li>Once the new site is working, this one is deleted.</li><li>Chats stay with the old site, so they're deleted with it. Your files are kept.</li></ul><button class="btn primary" type="button" data-act="move"${!SET.address || bad || (UP.data && UP.data.blockedAdmin) ? " disabled" : ""}>Set up the new address</button></div>`;
  }
  if (SET.tab === "updates") return updatesHtml();
  const ok = SET.confirm === CFG.name;
  return `${blockedNote()}<div class="danger-zone"><h3>Delete this site</h3><p>This removes the site from Cloudflare and deletes every chat in it. It can't be undone.</p><ul class="warn-list"><li>The site and all its chats are deleted.</li><li><code>${esc(CFG.command)}</code> stops running on your computer and its setup is removed.</li><li>Your files in the working folder are kept.</li></ul><div class="field"><label for="fDel">Type <b>${esc(CFG.name)}</b> to confirm</label><input class="input" id="fDel" value="${esc(SET.confirm)}" autocomplete="off" spellcheck="false">${SET.err ? `<div class="err-text">${esc(SET.err)}</div>` : ""}</div><button class="btn danger" type="button" data-act="delete"${ok && !(UP.data && UP.data.blockedAdmin) ? "" : " disabled"}>Delete this site</button></div>`;
}

function updatesHtml() {
  const u = UP.data;
  const v = x => "v" + x;
  if (!u) return '<p class="fine">Loading…</p>';
  if (pageIsStale()) return `<div class="sec"><h3>Updated to ${esc(v(u.current))}</h3>${whatsNewHtml(u, "Patch notes")}<p class="fine">Switching this page to ${esc(v(u.current))}.</p><div class="dlg-actions"><button class="btn primary" type="button" data-act="reload">Reload now</button></div></div>`;
  if (updateAvailable(u)) {
    return `<div class="sec"><div class="vrow"><b>${esc(v(u.current))}</b>${I.arrow}<b>${esc(v(u.latest))}</b></div>${u.released ? `<p>Released ${esc(u.released)}</p>` : ""}${u.notes.length ? `<h3>What's new</h3><ul class="notes">${u.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}${questionsHtml(u)}<div class="what"><div>${I.check}<span>${esc(CFG.name)} stays online, and you can close this while it runs.</span></div><div>${I.check}<span>Your chats and settings are kept.</span></div><div>${I.check}<span><code>${esc(CFG.command)}</code> on your computer restarts for a moment at the end.</span></div></div>${u.blocked ? `<div class="note soft">${esc(u.blocked.message)}</div>` : ""}${SET.err ? `<div class="note err">${esc(SET.err)}</div>` : ""}<div class="dlg-actions"><button class="btn primary" type="button" data-act="update"${u.blocked || SET.busy ? " disabled" : ""}>${SET.busy ? "Starting…" : "Update now"}</button></div><p class="fine">From ${esc(u.source)}. Checked ${u.checkedAt ? new Date(u.checkedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "just now"}.</p></div>`;
  }
  const earlier = (u.history || []).length ? `<details class="earlier" data-k="history"${UP.open.history ? " open" : ""}><summary>Earlier updates</summary>${u.history.map(h => `<div class="rel"><h3>${esc(v(h.version))}${h.released ? ` · ${esc(h.released)}` : ""}</h3>${notesList(h.notes)}</div>`).join("")}</details>` : "";
  return `<div class="sec"><h3>${SET.justUpdated ? `Updated to ${esc(v(u.current))}` : `${esc(v(newerThan(CFG.version, u.current) ? CFG.version : u.current))}${updateAvailable(u) || u.error ? "" : " is the newest version"}`}</h3>${u.error ? `<div class="note soft">Couldn't check for updates: ${esc(u.error)}</div>` : ""}${whatsNewHtml(u, "What's new")}${earlier}<div class="dlg-actions"><button class="btn ghost" type="button" data-act="check"${UP.checking ? " disabled" : ""}>${UP.checking ? "Checking…" : "Check again"}</button></div><p class="fine">From ${esc(u.source)}. ${esc(CFG.name)} looks for new versions every minute.</p></div>`;
}
// What a new version asks, answered here before it's installed. The answers are kept by the site and given to the new version
// once it's running on the computer.
const ANSWERS = {};
function answersNow(u) {
  const out = {};
  for (const q of (u && u.questions) || []) out[q.key] = q.key in ANSWERS ? ANSWERS[q.key] : !!q.default;
  return out;
}
function questionsHtml(u) {
  const qs = (u && u.questions) || [];
  if (!qs.length) return "";
  const a = answersNow(u);
  return `<div class="sec" style="margin-top:16px"><h3>This version asks</h3>${qs.map(q => `<div class="switch"><div class="t"><span>${esc(q.label)}</span>${q.help ? `<small>${esc(q.help)}</small>` : ""}</div><button type="button" class="toggle" role="switch" data-answer="${esc(q.key)}" aria-checked="${a[q.key]}" aria-label="${esc(q.label)}"></button></div>`).join("")}</div>`;
}
// This computer's own settings (the same ones `<command> edit` asks about), changed straight away: starting at login (a
// startup item), and the working folder.
const PC = { busy: "", err: "" };
function computerHtml() {
  const a = S.state && S.state.agent;
  const c = a && a.online && a.computer;
  const off = !c ? " disabled" : "";
  const why = !a || !a.online ? `${esc(CFG.name)} is offline, so these can't be changed right now.` : !c ? `Update ${esc(CFG.name)} to change these here, or run <code>${esc(CFG.command)} edit</code> on your computer.` : "";
  const auto = `<div class="switch"><div class="t"><span>${esc(`Start ${CFG.name} when you log in`)}</span><small>Makes it a startup item on this computer, so it's online whenever you're logged in.</small></div><button type="button" class="toggle" role="switch" data-pc="autostart" aria-checked="${!!(c && c.autostart)}" aria-label="${esc(`Start ${CFG.name} when you log in`)}"${off}></button></div>`;
  const ws = c && c.workspace ? `<div class="field"><label for="fWs">Working folder</label><input class="input" id="fWs" value="${esc(PC.ws !== undefined ? PC.ws : c.workspace)}" autocomplete="off" spellcheck="false"><small>Where ${esc(CFG.name)} works and where files you attach go. Changed when you press Enter or click away; it's made if it isn't there.${PC.busy === "workspace" ? ' <b class="ok-text">Saving…</b>' : ""}</small></div>` : "";
  return `<div class="sec"><h3>This computer</h3>${why ? `<p>${why}</p>` : ""}${auto}${ws}${PC.err ? `<div class="err-text">${esc(PC.err)}</div>` : ""}</div>`;
}
// The switch moves at once; if the computer says no, it moves back and says why.
async function setComputer(key, value) {
  const a = S.state && S.state.agent;
  if (!a || !a.computer || (key === "workspace" && (!value || value === a.computer.workspace))) return;
  const before = { ...a.computer };
  a.computer = { ...a.computer, [key]: value };
  if (key === "workspace") PC.ws = value;
  PC.busy = key;
  PC.err = "";
  renderSettings();
  try {
    const r = await apiJson("/api/computer", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ [key]: value }) });
    a.computer = r.computer || a.computer;
  } catch (e) {
    a.computer = (e.data && e.data.computer) || before;
    PC.err = e.message === "Signed out" ? "" : switching(e);
  }
  PC.ws = undefined;
  PC.busy = "";
  renderSettings();
  renderBar();
}
function notesList(notes) {
  return `<ul class="notes">${(notes || []).map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
}
// The patch notes of the version that is installed, from the site.
function whatsNewHtml(u, head) {
  const w = u && u.whatsNew;
  return w && w.notes.length ? `<h3>${esc(head)}</h3>${w.released ? `<p class="fine" style="margin:0 0 4px">Released ${esc(w.released)}</p>` : ""}${notesList(w.notes)}` : "";
}

// There's nothing to save anymore: every change applies by itself.
function renderFoot() { $("setFoot").hidden = true; }

// The site's name and images as they are now. Changing them takes effect at once, on every device, with no redeploy.
// what the browser tab says: its own text when one is set in Settings → Appearance, or the site's name
function tabName() { return CFG.tab || CFG.name; }
function siteNow() { return (S.state && S.state.site) || { name: CFG.name, logo: !!document.querySelector("#brand img"), favicon: false, v: "0" }; }
function applySite(site) {
  if (!site) return;
  if (S.state) S.state.site = site;
  CFG.name = site.name;
  CFG.tab = site.tab || "";
  $("input").placeholder = `Ask ${CFG.name}`;
  // the command on the computer follows the name, once the computer has renamed it
  if (site.command) CFG.command = site.command;
  document.title = S.chat && S.chat.title ? `${S.chat.title} · ${tabName()}` : tabName();
  $("brand").setAttribute("aria-label", CFG.name);
  const mark = $("brand").firstElementChild;
  // no logo on the page: the rail shows the tab icon
  const want = `<img src="/favicon?v=${esc(site.v)}" alt="">`;
  if (mark && mark.outerHTML !== want) mark.outerHTML = want;
  const icon = document.querySelector('link[rel="icon"]');
  if (icon) icon.href = `/favicon?v=${site.v}`;
}
async function saveSite(what, body) {
  SET.saving = what;
  SET.saved = "";
  SET.err = "";
  renderSettings();
  try {
    applySite(await apiJson("/api/site", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }));
    // what names the site (the line under the message box, the hero) follows a rename at once
    renderChrome();
    SET.saved = what;
    if (what === "name") SET.name = undefined;
    if (what === "tab") SET.tabTitle = undefined;
  } catch (e) {
    SET.err = e.message === "Signed out" ? "" : switching(e);
  }
  SET.saving = "";
  renderSettings();
}
function saveName() {
  if (SET.name === undefined || !isDirty() || draftError() || SET.saving) return;
  saveSite("name", { displayName: nameTyped() });
}
function readImage(file, key) {
  if (!file) return;
  if (file.size > 512 * 1024) { SET.err = "That image is bigger than 512 KB."; renderSettings(); return; }
  const r = new FileReader();
  r.onload = () => saveSite(key, { [key]: { b64: String(r.result).split(",")[1] || "" } });
  r.onerror = () => toast("Couldn't read that image.");
  r.readAsDataURL(file);
}

async function adminCall(path, body) {
  SET.busy = true;
  SET.err = "";
  renderSettings();
  try {
    applyUpdate(await apiJson(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) }));
  } catch (e) {
    SET.err = e.message === "Signed out" ? "" : e.message;
  }
  SET.busy = false;
  renderSettings();
}

$("setBody").addEventListener("input", e => {
  if (e.target.id === "fName") { SET.name = e.target.value; SET.saved = ""; e.target.classList.toggle("bad", !!draftError()); }
  else if (e.target.id === "fTab") { SET.tabTitle = e.target.value; SET.saved = ""; }
  else if (e.target.id === "fAddr") { SET.address = e.target.value.trim().toLowerCase(); const bad = SET.address && !SLUG_OK.test(SET.address); const b = $("setBody").querySelector("[data-act=move]"); if (b) b.disabled = !SET.address || !!bad || !!(UP.data && UP.data.blockedAdmin); }
  else if (e.target.id === "fDel") { SET.confirm = e.target.value; const b = $("setBody").querySelector("[data-act=delete]"); if (b) b.disabled = SET.confirm !== CFG.name || !!(UP.data && UP.data.blockedAdmin); }
});
$("setBody").addEventListener("change", e => {
  if (e.target.id === "fName") saveName();
  if (e.target.id === "fTab") saveTab();
  if (e.target.id === "fWs") setComputer("workspace", e.target.value.trim());
  if (e.target.id === "fImg" && SET.pickKey) { readImage(e.target.files[0], SET.pickKey); e.target.value = ""; }
});
$("setBody").addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab-set]");
  if (tab) { SET.tab = tab.dataset.tabSet; SET.err = ""; return renderSettings(); }
  const th = e.target.closest("[data-theme-set]");
  if (th) return setTheme(th.dataset.themeSet);
  const copy = e.target.closest("[data-copy-link]");
  if (copy) return copyText(copy.dataset.copyLink, copy);
  const pc = e.target.closest("[data-pc]");
  if (pc) return setComputer(pc.dataset.pc, pc.dataset.value !== undefined ? pc.dataset.value : pc.getAttribute("aria-checked") !== "true");
  const ans = e.target.closest("[data-answer]");
  if (ans) { ANSWERS[ans.dataset.answer] = ans.getAttribute("aria-checked") !== "true"; return renderSettings(); }
  const img = e.target.closest("[data-img]");
  if (img) { SET.pickKey = img.dataset.img; $("fImg").click(); return; }
  const reset = e.target.closest("[data-img-reset]");
  if (reset) return saveSite(reset.dataset.imgReset, { [reset.dataset.imgReset]: null });
  const act = e.target.closest("[data-act]");
  if (!act) return;
  await doAct(act.dataset.act);
});
$("setBody").addEventListener("keydown", e => {
  if (e.target.id === "fName" && e.key === "Enter") { e.preventDefault(); saveName(); }
  if (e.target.id === "fTab" && e.key === "Enter") { e.preventDefault(); saveTab(); }
  if (e.target.id === "fWs" && e.key === "Enter") { e.preventDefault(); e.target.blur(); }
});

async function doAct(act) {
  if (act === "move") {
    if (!(await askConfirm({ title: `Set up ${SET.address}${hostParts().suffix}?`, text: `The new site is created first and this one keeps working until you've turned on Cloudflare Access for it. Then this site is deleted, along with its chats.`, ok: "Set it up" }))) return;
    return adminCall("/api/admin/move", { address: SET.address });
  }
  if (act === "delete") {
    if (!(await askConfirm({ title: `Delete ${CFG.name} and every chat in it?`, text: "The site, its chats and its setup on your computer are removed. The working folder is kept. This can't be undone.", ok: "Delete", danger: true }))) return;
    return adminCall("/api/admin/delete", { confirm: SET.confirm });
  }
  if (act === "update") {
    SET.busy = true; SET.err = ""; renderSettings();
    try { applyUpdate(await apiJson("/api/update/start", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ to: UP.data.latest, answers: answersNow(UP.data) }) })); }
    catch (e) { SET.err = e.message === "Signed out" ? "" : e.message; if (e.data && (e.data.code === "changed" || e.data.code === "current")) await pollUpdate(); }
    SET.busy = false;
    return renderSettings();
  }
  if (act === "check") {
    UP.checking = true; renderSettings();
    try { applyUpdate(await apiJson("/api/update/check", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" })); } catch (e) { toast(e.message); }
    UP.checking = false;
    return renderSettings();
  }
  if (act === "dismiss") {
    UP.gone = null;
    try { applyUpdate(await apiJson("/api/update/dismiss", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" })); } catch (e) { toast(e.message); }
    return renderSettings();
  }
  if (act === "retry") {
    try { applyUpdate(await apiJson("/api/update/dismiss", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" })); } catch {}
    return doAct("update");
  }
  if (act === "cancel") {
    if (!(await askConfirm({ title: "Cancel the move?", text: "The new site is removed and this one stays as it is.", ok: "Cancel the move", cancel: "Keep going", danger: true }))) return;
    try { applyUpdate(await apiJson("/api/admin/cancel", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" })); } catch (e) { toast(e.message); }
    return renderSettings();
  }
  if (act === "reload") return reloadNow();
  if (act === "hide") return closeSettings();
}
$("setClose").onclick = closeSettings;
$("setDlg").addEventListener("click", e => { if (e.target === $("setDlg")) closeSettings(); });

/* ---------- whatever is running: the checklist ---------- */
function upRun() { return UP.data && UP.data.run ? UP.data.run : null; }
// Behind the site: the site runs a newer version than this page. Never the other way round: for a moment after an update the
// page can be new while the site still answers as the old one, and that page is already where it should be.
// Only when GitHub has something newer than both this page and the site. Right after an update the site can still answer as
// the old version for a moment while this page is already the new one; that's not an update waiting.
function updateAvailable(u) { return !!(u && u.available && u.latest && newerThan(u.latest, CFG.version)); }
function pageIsStale() { return !!(UP.data && UP.data.current && newerThan(UP.data.current, CFG.version)); }
function newerThan(a, b) {
  const x = /^(\d+)\.(\d+)\.(\d+)/.exec(String(a || ""));
  const y = /^(\d+)\.(\d+)\.(\d+)/.exec(String(b || ""));
  if (!x || !y) return !!a && a !== b;
  for (let i = 1; i <= 3; i++) if (+x[i] !== +y[i]) return +x[i] > +y[i];
  return false;
}
function stepState(run, key) {
  let st = run.steps[key] || (key === run.step ? "active" : "pending");
  if (run.state === "error" && key === run.step && st !== "done") st = "error";
  if (run.state === "done") st = "done";
  return st;
}
function stepsHtml(run) {
  return `<ol class="steps">${(run.plan || []).map(({ key, label }) => {
    const st = stepState(run, key);
    const ic = st === "done" ? UP_ICON.check : st === "error" ? UP_ICON.x : st === "active" ? '<span class="spin"></span>' : "";
    return `<li class="${st}"${st === "active" ? ' aria-current="step"' : ""}><span class="ic">${ic}</span><span>${esc(label)}</span></li>`;
  }).join("")}</ol>`;
}
const UP_ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>'
};
// What an update brings, under its checklist. A run from before the site kept the notes with it falls back to the release's.
// One bar and the step it's on; the whole list is there if you want it.
function progressHtml(run) {
  const plan = run.plan || [];
  const done = plan.filter(({ key }) => stepState(run, key) === "done").length;
  const cur = plan.find(({ key }) => stepState(run, key) === "active") || plan[Math.min(done, plan.length - 1)];
  const pct = plan.length ? Math.max(4, Math.round(((done + 0.5) / plan.length) * 100)) : 50;
  return `<div class="prog"><div class="mt-bar"><i style="width:${pct}%"></i></div><div class="prog-step"><span class="spin"></span><span>${esc(cur ? cur.label : "Working")}</span><small>${Math.min(done + 1, plan.length)} of ${plan.length}</small></div></div><details class="earlier" data-k="steps"${UP.open.steps ? " open" : ""}><summary>All steps</summary>${stepsHtml(run)}</details>`;
}
function runNotes(run) {
  if ((run.kind || "update") !== "update") return "";
  const u = UP.data;
  const notes = run.notes && run.notes.length ? run.notes : u && u.latest === run.to ? u.notes : (u && u.whatsNew && u.whatsNew.version === run.to ? u.whatsNew.notes : []);
  return notes.length && run.state === "done" ? `<div class="sect" style="margin-top:14px"><h3>Patch notes</h3>${notesList(notes)}</div>` : "";
}
function runTitle(run) {
  return { update: `Updating to v${run.to}`, settings: "Saving your changes", move: "Moving to a new address", delete: "Deleting the site" }[run.kind || "update"] || "Working";
}

// Puts new markup into a part of the page without rebuilding what didn't change. Panels that are drawn again every second
// or so while something runs (the update checklist) keep what you opened open, keep their spinners turning and don't flash.
// What's open in a <details> is yours: redrawing never opens or closes one that's already there.
function patchHtml(el, html) {
  const t = document.createElement("template");
  t.innerHTML = html;
  morphKids(el, t.content);
}
function morphKids(a, b) {
  const an = [...a.childNodes];
  const bn = [...b.childNodes];
  for (let i = 0; i < bn.length; i++) {
    const x = an[i];
    const y = bn[i];
    if (!x) { a.appendChild(y); continue; }
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName || (x.nodeType === 1 && x.id !== y.id)) { a.replaceChild(y, x); continue; }
    if (x.nodeType !== 1) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    const keep = n => x.nodeName === "DETAILS" && n === "open";
    for (const at of [...x.attributes]) if (!y.hasAttribute(at.name) && !keep(at.name)) x.removeAttribute(at.name);
    for (const at of [...y.attributes]) if (x.getAttribute(at.name) !== at.value && !keep(at.name)) x.setAttribute(at.name, at.value);
    morphKids(x, y);
  }
  for (let i = an.length - 1; i >= bn.length; i--) a.removeChild(an[i]);
}

function renderJob() {
  const run = upRun() || UP.gone;
  const kind = run.kind || "update";
  // only written when they change, so nothing redraws while the panel is asked again every second and a half
  const keepText = el => ({ set textContent(v) { if (el.textContent !== v) el.textContent = v; } });
  const title = keepText($("setTitle"));
  const sub = keepText($("setSub"));
  const dismiss = `<button class="btn ghost" type="button" data-act="dismiss">Close</button>`;
  const info = run.info || {};
  const newLink = info.site ? `<div class="linkbox"><span>${esc(info.site)}</span><button class="btn ghost" type="button" data-copy-link="${esc(info.site)}">${I.copy}<span>Copy</span></button></div>` : "";
  let html = "";
  if (UP.gone) {
    // The site this page is talking to has been deleted: that is the end of a move or a delete.
    if (kind === "move" && info.site) {
      title.textContent = "Moved to your new address";
      sub.textContent = "The old site is deleted.";
      html = `<p style="margin:0;color:var(--text-2)">${esc(CFG.name)} now lives here. Open it, sign in with Cloudflare Access, and carry on.</p>${newLink}<div class="dlg-actions"><a class="btn primary" href="${esc(info.site)}">Open the new site</a></div>`;
    } else {
      title.textContent = "The site is deleted";
      sub.textContent = "";
      html = `<p style="margin:0;color:var(--text-2)">${esc(CFG.name)} and its chats are gone, and <code>${esc(CFG.command)}</code> has stopped. Your files in the working folder are still there. Run the setup again whenever you want a new site.</p>`;
    }
  } else if (run.state === "running") {
    title.textContent = runTitle(run);
    sub.textContent = kind === "update" ? `From v${run.from}` : "";
    html = progressHtml(run);
    if (kind === "move" && run.step === "access") {
      html += info.site ? `<div class="sec" style="margin-top:14px"><h3>Turn on Cloudflare Access for the new address</h3><p>Nobody can open the new site until you do. This one stays online meanwhile.</p><ol class="howto"><li>Open the <a href="${esc(info.dash || "https://dash.cloudflare.com/")}" target="_blank" rel="noopener noreferrer">Cloudflare dashboard</a>: <b>Workers &amp; Pages</b> &rarr; <b>${esc(info.name || "")}</b> &rarr; <b>Settings</b> &rarr; <b>Domains &amp; Routes</b>.</li><li>On the <b>workers.dev</b> row choose <b>Enable Cloudflare Access</b>, then <b>Manage Cloudflare Access</b> and allow only <b>your own email address</b>.</li><li>Open your <a href="${esc(info.claim || info.site)}" target="_blank" rel="noopener noreferrer">claim link</a> and sign in with that email. That makes the new site yours.</li></ol><div class="wait"><span class="spin"></span><span>Waiting for you to open the new site. This page updates by itself.</span></div><div class="dlg-actions"><a class="btn primary" href="${esc(info.claim || info.site)}" target="_blank" rel="noopener noreferrer">Open the claim link</a><button class="btn ghost" type="button" data-act="cancel">Cancel the move</button></div></div>` : "";
    } else {
      html += `<p class="fine">You can close this: it carries on by itself, and the button in the top bar shows how far it's got.${UP.failing > 1 ? " Reconnecting to the site…" : ""}</p><div class="dlg-actions"><button class="btn ghost" type="button" data-act="hide">Hide</button></div>`;
    }
  } else if (run.state === "done") {
    if (kind === "settings") {
      title.textContent = "Your changes are live";
      sub.textContent = "";
      html = stepsHtml(run) + `<div class="dlg-actions"><button class="btn primary" type="button" data-act="reload">Reload to see them</button></div>`;
    } else {
      const to = run.to || (UP.data && UP.data.current);
      if (!liveAt(to)) {
        // the steps are done, but the site hasn't answered as the new version yet: the bar keeps going until it does
        title.textContent = `Updating to v${to}`;
        sub.textContent = run.from ? `From v${run.from}` : "";
        html = `<div class="prog"><div class="mt-bar"><i style="width:96%"></i></div><div class="prog-step"><span class="spin"></span><span>Making sure the new version is live</span><small>almost done</small></div></div><details class="earlier" data-k="steps"${UP.open.steps ? " open" : ""}><summary>All steps</summary>${stepsHtml(run)}</details>`;
      } else {
        title.textContent = `Updated to v${to}`;
        sub.textContent = "Your chats are all still here.";
        html = stepsHtml(run) + runNotes(run) + `<p class="fine">Switching this page to the new version.</p><div class="dlg-actions"><button class="btn primary" type="button" data-act="reload">Reload now</button></div>`;
      }
    }
  } else {
    title.textContent = kind === "move" && run.step === "cleanup" ? "The new site is ready" : "That didn't finish";
    sub.textContent = "";
    html = stepsHtml(run) + `<div class="note err">${esc(run.message || "Something went wrong.")}</div>${kind === "move" && run.step === "cleanup" && info.site ? `<p class="fine">Your new site works. Open it from here:</p>${newLink}` : '<p class="fine">Your chats are safe.</p>'}<div class="dlg-actions">${kind === "update" && UP.data && UP.data.available ? `<button class="btn primary" type="button" data-act="retry"${UP.data.blocked ? " disabled" : ""}>Try again</button>` : ""}${dismiss}</div>`;
  }
  patchHtml($("setBody"), `<div class="dlg-body">${html}</div>`);
  $("setFoot").hidden = true;
}

// What's opened in the update panel stays open, whatever it's redrawn as next.
$("setBody").addEventListener("toggle", e => {
  if (e.target.matches && e.target.matches("details[data-k]")) UP.open[e.target.dataset.k] = e.target.open;
}, true);

/* ---------- following a job from any device ---------- */
const OPEN_LABEL = { update: "Updating", settings: "Saving", move: "Moving", delete: "Deleting" };
function renderPill() {
  const b = $("updatePill");
  const run = upRun();
  const u = UP.data;
  let text = "", short = "", cls = "pill";
  if (UP.gone) { b.hidden = true; return; }
  if (run && run.state === "running") {
    const total = (run.plan || []).length;
    const done = (run.plan || []).filter(({ key }) => stepState(run, key) === "done").length;
    const at = Math.min(done + 1, total); // the step it's on, as the update screen counts it
    text = run.kind === "delete" ? "Deleting…" : `${OPEN_LABEL[run.kind || "update"]} ${at}/${total}`; short = `${at}/${total}`; cls += " busy";
  } else if (run && run.state === "error") { text = "Didn't finish"; short = "Failed"; cls += " bad"; }
  else if (run && run.state === "done" && run.kind === "settings") { text = "Reload"; short = "Reload"; }
  else if (run && run.state === "done" && run.kind !== "settings" && !liveAt(run.to)) { text = "Finishing…"; short = "…"; cls += " busy"; }
  else if (run && run.state === "done" && UP.seen === run.id && !pageIsStale()) { text = "Updated · Reload"; short = "Reload"; }
  else if (pageIsStale() && !reloadAsked()) { text = "Updated · Reload"; short = "Reload"; }
  // on a phone, an update waiting is just the icon, as ChatGPT keeps its top bar to ☰, the model and one button
  else if (updateAvailable(u)) { text = "Update"; short = ""; cls += " up"; }
  b.hidden = !text;
  b.className = cls + (short ? "" : " solo");
  // and beside you at the bottom of the sidebar, where ChatGPT has Upgrade
  $("sideUp").hidden = !(updateAvailable(u) && !run && !pageIsStale());
  b.title = text;
  b.setAttribute("aria-label", text);
  $("pillText").textContent = text;
  $("pillShort").textContent = short;
}
// One click: a finished update or change reloads straight away, rather than opening a panel that has another Reload button.
$("sideUp").onclick = () => openSettings("updates");
$("updatePill").onclick = () => {
  const run = upRun();
  if (run ? run.state === "done" : pageIsStale()) return reloadNow();
  openSettings(run ? "general" : "updates");
};

// Reloading for a version is remembered in this browser. If the page that comes back is still the old one (for a few seconds
// after an update, Cloudflare can still hand out the previous version), it says nothing more about it and quietly tries again.
function reloadNow() {
  if (pageIsStale()) store.set("reloadFor", UP.data.current);
  location.reload();
}
function reloadAsked() { return pageIsStale() && store.get("reloadFor", "") === UP.data.current; }

// A page that is behind the site (an update finished, here or from another device) moves to the new version by itself, as
// soon as that can't lose anything: nothing typed or attached, no reply being written, no unsaved changes in Settings. At most
// three times per version in a tab, further apart each time, so a page that somehow stays old can't loop.
function reloadedTo() { try { return sessionStorage.getItem("gql.reloadedTo") || ""; } catch { return ""; } }
function maybeReload(wait) {
  clearTimeout(UP.reloadTimer);
  const run = upRun();
  const [ver, n] = reloadedTo().split("#");
  const tries = ver === UP.data.current ? Number(n) || 1 : 0;
  if (!pageIsStale() || UP.gone || (run && run.state !== "done") || tries >= 3) return;
  UP.reloadTimer = setTimeout(() => {
    const r = upRun();
    if (!pageIsStale() || (r && r.state !== "done")) return;
    if ($("input").value.trim() || S.files.length || S.busy || S.live || isDirty()) return maybeReload(2000);
    try { sessionStorage.setItem("gql.reloadedTo", `${UP.data.current}#${tries + 1}`); } catch {}
    reloadNow();
  }, Math.max(wait, tries * 5000));
}
// After an update, the first time this browser opens the new version, the Updates panel opens with the patch notes.
function announceVersion() {
  const seen = store.get("seenVersion", "");
  store.set("seenVersion", CFG.version);
  const w = UP.data && UP.data.whatsNew;
  if (seen === CFG.version || upRun() || !w || !w.updated || w.version !== CFG.version) return;
  SET.justUpdated = true;
  openSettings("updates");
}

function schedulePoll() {
  clearTimeout(UP.timer);
  const run = upRun();
  if (run && run.state === "running" && !UP.gone) UP.timer = setTimeout(pollUpdate, 1500);
}
// Not through api(): while a site is being deleted or moved, a failed or redirected request is the expected way for it to end.
async function pollUpdate() {
  clearTimeout(UP.timer);
  let u = null;
  try {
    const res = await fetch("/api/update", { redirect: "manual", credentials: "same-origin" });
    if (res.ok && res.type !== "opaqueredirect") u = await res.json().catch(() => null);
  } catch {}
  if (u && u.current !== undefined) {
    UP.failing = 0;
    return applyUpdate(u);
  }
  UP.failing++;
  const run = UP.lastRun;
  const ending = run && run.state === "running" && (run.kind === "delete" || (run.kind === "move" && (run.step === "cleanup" || UP.failing >= 6)));
  if (ending && UP.failing >= 3) {
    UP.gone = run;
    clearTimeout(UP.timer);
    renderPill();
    // the site this page belongs to is gone: say so, whether or not the panel was open
    if (!$("setDlg").open) $("setDlg").showModal();
    renderSettings();
    return;
  }
  if ($("setDlg").open && upRun()) renderSettings();
  schedulePoll();
}
// Which version the site really answers as, front and back (GET /api/version), checked after an update says it's done.
function liveAt(version) { return !version || (UP.live && UP.live.worker === version && UP.live.hub === version) || CFG.version === version; }
async function checkLive(version) {
  if (UP.checkingLive) return;
  UP.checkingLive = true;
  for (let i = 0; i < 90 && !liveAt(version); i++) {
    try {
      const r = await fetch("/api/version", { credentials: "same-origin", cache: "no-store" });
      if (r.ok) UP.live = await r.json();
    } catch {}
    // an older site has no /api/version: what it says about itself has to do
    if (!liveAt(version) && UP.data && UP.data.current === version && i >= 2) UP.live = { worker: version, hub: version };
    if (!liveAt(version)) await new Promise(res => setTimeout(res, 700));
  }
  UP.live = UP.live && liveAt(version) ? UP.live : { worker: version, hub: version };
  UP.checkingLive = false;
  renderPill();
  if ($("setDlg").open) renderSettings();
  if (pageIsStale()) maybeReload(0);
}
function finishedHere(run) { return !!run && run.state === "done" && !pageIsStale() && UP.seen !== run.id; }
function applyUpdate(u) {
  if (!u) return;
  const prev = upRun();
  UP.data = u;
  const run = upRun();
  if (run) UP.lastRun = run;
  // Seen running here: the pill shows how it's going. The panel only opens if it was started here (it's open already then).
  if (run && run.state === "running" && UP.seen !== run.id) UP.seen = run.id;
  if (prev && prev.state === "running" && run && run.state === "done" && !$("setDlg").open) toast(run.kind === "settings" ? "Your changes are live. Reload to see them." : `Updated to v${run.to}. Switching to it…`, 8000);
  // A finished update or change that this page didn't watch is already in it: the page was loaded (or reloaded) after it was
  // done. So there's nothing to say about it anymore, here or on any other device, and it's cleared until the next one. Only
  // a page that watched it, or is still on the old version, says "Updated · Reload", and only until it reloads once.
  if (finishedHere(run)) {
    UP.data = { ...u, run: null };
    if (!UP.dismissing) {
      UP.dismissing = true;
      api("/api/update/dismiss", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" }).catch(() => {}).finally(() => { UP.dismissing = false; });
    }
  }
  renderPill();
  if ($("setDlg").open) renderSettings();
  if (!$("pmenu").hidden) $("pmenu").innerHTML = profileMenu();
  renderChrome();
  schedulePoll();
  // a finished update is only "updated" once the site answers as the new version; then the page moves over at once
  if (run && run.state === "done" && run.kind !== "settings" && !liveAt(run.to)) return checkLive(run.to);
  if (pageIsStale()) maybeReload(prev && prev.state === "running" ? 300 : 600);
}

applyTheme();

renderBar();
renderChrome();
(async () => {
  await Promise.all([loadState(), loadChats()]);
  announceVersion();
  const m = location.pathname.match(/^\/c\/([\w-]+)/);
  if (m) await openChat(m[1], false);
  else {
    loadDraft();
    input.focus();
  }
  if (document.readyState === "complete") highlight(document);
  else window.addEventListener("load", () => highlight(document));
})();
})();
</script>
</body>
</html>
