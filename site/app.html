<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>try{var t=JSON.parse(localStorage.getItem("gql.theme"));if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>__SITE_NAME__</title>
<link rel="icon" href="/favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#FBFBFD;--rail:#EEF1F5;--raise:#FFFFFF;--ink:#172036;--ink-2:#4A5468;--ink-3:#7C8699;--line:#DDE2EA;--line-2:#E8ECF1;
  --accent:#0E8C86;--accent-ink:#FFFFFF;--accent-soft:#E2F2F0;--bubble:#E7F0EF;--code:#F1F3F7;--hover:rgba(23,32,54,.06);
  --danger:#B93A33;--danger-soft:#FBEDEB;--warn:#B7791F;--shadow:0 18px 48px -18px rgba(23,32,54,.32),0 2px 6px rgba(23,32,54,.06);
  --hl-k:#7C3AED;--hl-s:#0B7A55;--hl-n:#B45309;--hl-c:#8A94A6;--hl-t:#1D4ED8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10161F;--rail:#0B1018;--raise:#161E29;--ink:#E4EAF2;--ink-2:#A9B4C4;--ink-3:#748094;--line:#222C3A;--line-2:#1A2330;
    --accent:#39C3B8;--accent-ink:#062523;--accent-soft:#12302E;--bubble:#173130;--code:#161E2A;--hover:rgba(228,234,242,.06);
    --danger:#F08A80;--danger-soft:#2E1716;--warn:#E9B35A;--shadow:0 18px 48px -18px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.3);
    --hl-k:#C4A5FF;--hl-s:#6FD3A8;--hl-n:#F3B562;--hl-c:#6B7689;--hl-t:#8FB4FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10161F;--rail:#0B1018;--raise:#161E29;--ink:#E4EAF2;--ink-2:#A9B4C4;--ink-3:#748094;--line:#222C3A;--line-2:#1A2330;
  --accent:#39C3B8;--accent-ink:#062523;--accent-soft:#12302E;--bubble:#173130;--code:#161E2A;--hover:rgba(228,234,242,.06);
  --danger:#F08A80;--danger-soft:#2E1716;--warn:#E9B35A;--shadow:0 18px 48px -18px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.3);
  --hl-k:#C4A5FF;--hl-s:#6FD3A8;--hl-n:#F3B562;--hl-c:#6B7689;--hl-t:#8FB4FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Onest,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block}
.app{--side-w:272px;--panel-w:0px;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--panel-w);height:100vh;height:100dvh}
.app.side-collapsed{--side-w:0px}
.app.side-collapsed .side{display:none}
.app.panel-open{--panel-w:min(50vw,860px)}
.side{grid-column:1;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 16px}
.brand{display:flex;align-items:center;gap:9px;min-width:0;text-decoration:none;color:var(--ink);font-weight:700;font-size:17px;letter-spacing:-.015em}
.brand svg,.brand img{width:26px;height:26px;flex:none;border-radius:7px;object-fit:contain}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.new-chat{margin:4px 10px 8px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:600;background:var(--raise);border:1px solid var(--line);box-shadow:0 1px 0 var(--line-2)}
.new-chat:hover{border-color:var(--accent)}
.new-chat svg{width:18px;height:18px;color:var(--accent)}
.search{margin:0 10px 6px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:10px;color:var(--ink-3)}
.search:focus-within{background:var(--hover)}
.search svg{width:16px;height:16px;flex:none}
.search input{flex:1;border:0;background:none;outline:none;padding:8px 0;min-width:0}
.search input::placeholder{color:var(--ink-3)}
.history{flex:1;overflow-y:auto;padding:4px 8px 12px;min-height:0}
.group{font-size:12px;color:var(--ink-3);padding:14px 10px 4px;font-weight:500}
.item{position:relative;display:flex;align-items:center;border-radius:10px}
.item a{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 10px;color:var(--ink);text-decoration:none;border-radius:10px}
.item a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item a svg{width:14px;height:14px;flex:none;color:var(--ink-3)}
.item:hover,.item.on{background:var(--hover)}
.item.on a{font-weight:600}
.item .more{opacity:0;width:28px;height:28px;margin-right:4px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.item:hover .more,.item.on .more,.item .more[aria-expanded="true"]{opacity:1}
.item .more:hover{background:var(--hover);color:var(--ink)}
.item .more svg{width:16px;height:16px}
.item .live{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.4s ease-in-out infinite}
.item input{flex:1;margin:3px 4px;padding:5px 8px;border:1px solid var(--accent);border-radius:8px;background:var(--raise);outline:none}
.menu{position:absolute;z-index:30;min-width:150px;padding:5px;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--danger)}
.menu svg{width:15px;height:15px}
.empty-list{padding:18px 12px;color:var(--ink-3);font-size:13px}
.side-foot{display:flex;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.theme{position:relative;display:grid;grid-template-columns:1fr 1fr;width:74px;height:36px;padding:3px;border-radius:999px;background:var(--raise);border:1px solid var(--line)}
.theme .knob{position:absolute;top:3px;left:3px;width:33px;height:28px;border-radius:999px;background:var(--accent-soft);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform .22s cubic-bezier(.3,.7,.3,1)}
.theme.dark .knob{transform:translateX(33px)}
.theme span{position:relative;display:grid;place-items:center;color:var(--ink-3);transition:color .2s}
.theme svg{width:16px;height:16px}
.theme:not(.dark) .sun,.theme.dark .moon{color:var(--accent)}
.theme:hover{border-color:var(--ink-3)}
.scrim{display:none}
.main{grid-column:2;display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;height:100dvh;position:relative}
.top{flex:none;height:58px;display:flex;align-items:center;gap:8px;padding:0 12px}
.top .grow{flex:1}
.only-collapsed,.only-narrow{display:none}
.app.side-collapsed .only-collapsed{display:grid}
.picker-wrap{position:relative}
.picker-btn{display:flex;align-items:center;gap:10px;height:40px;white-space:nowrap;padding:0 10px 0 13px;border-radius:12px;font-weight:600;font-size:15px}
.picker-btn:hover,.picker-btn[aria-expanded="true"]{background:var(--hover)}
.picker-btn .pb-effort{font-weight:500;color:var(--ink-2);font-size:14px}
.picker-btn .chev{width:16px;height:16px;color:var(--ink-3)}
.meter{display:flex;align-items:flex-end;gap:2px;height:14px}
.meter i{display:block;width:3px;border-radius:2px;background:var(--line)}
.meter i:nth-child(1){height:5px}.meter i:nth-child(2){height:7px}.meter i:nth-child(3){height:9px}.meter i:nth-child(4){height:11px}.meter i:nth-child(5){height:14px}
.meter i.f{background:var(--accent)}
.picker{position:absolute;top:calc(100% + 6px);left:0;z-index:35;width:360px;max-width:calc(100vw - 24px);background:var(--raise);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px;transform-origin:top left;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
.pm{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;width:100%;padding:10px 12px;border-radius:12px;text-align:left}
.pm:hover{background:var(--hover)}
.pm b{font-weight:600}
.pm small{grid-column:1;color:var(--ink-3);font-size:13px}
.pm .tag{grid-column:1;justify-self:start;margin-top:4px;font-size:11.5px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:1px 7px;border-radius:999px}
.pm .tick{grid-row:1/span 3;grid-column:2;width:18px;height:18px;color:var(--accent);visibility:hidden}
.pm.on .tick{visibility:visible}
.effort{margin-top:6px;padding:12px 12px 8px;border-top:1px solid var(--line)}
.effort-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.effort-head b{font-weight:600}
.effort-head small{color:var(--ink-3);font-size:12.5px}
.stairs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end}
.step{display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 2px 6px;border-radius:10px}
.step:hover{background:var(--hover)}
.step .bar{width:24px;border-radius:6px;background:var(--line);transition:background .15s}
.step:nth-child(1) .bar{height:10px}.step:nth-child(2) .bar{height:18px}.step:nth-child(3) .bar{height:26px}.step:nth-child(4) .bar{height:34px}.step:nth-child(5) .bar{height:42px}
.step.f .bar{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.step.on .bar{background:var(--accent)}
.step span{font-size:12px;color:var(--ink-2);white-space:nowrap}
.step.on span{color:var(--ink);font-weight:600}
.effort-none{color:var(--ink-3);font-size:13px;padding:2px 0 6px}
.pick-note{display:flex;gap:9px;margin:4px 4px 4px;padding:10px 12px;border-radius:12px;background:var(--rail);color:var(--ink-2);font-size:12.5px;line-height:1.45}
.pick-note svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--warn)}
.thread{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.thread-inner{max-width:780px;margin:0 auto;padding:10px 24px 36px}
.msg{margin:22px 0}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.bubble{max-width:min(85%,620px);background:var(--bubble);padding:10px 16px;border-radius:20px 20px 6px 20px;white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.55}
.attach-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px;max-width:85%}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 8px 5px 10px;border:1px solid var(--line);border-radius:10px;background:var(--raise);font-size:12.5px;max-width:240px}
.chip svg{width:14px;height:14px;color:var(--ink-3);flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{color:var(--ink-3);flex:none}
.chip button{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3)}
.chip button:hover{background:var(--hover);color:var(--ink)}
.msg.bot{font-size:15.5px;line-height:1.66}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 .85em}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.3;margin:1.4em 0 .5em;font-weight:650;letter-spacing:-.01em}
.md h1{font-size:1.45em}.md h2{font-size:1.25em}.md h3{font-size:1.1em}.md h4,.md h5,.md h6{font-size:1em}
.md ul,.md ol{margin:0 0 .85em;padding-left:1.45em}
.md li{margin:.25em 0}
.md li>ul,.md li>ol{margin:.25em 0}
.md li::marker{color:var(--ink-3)}
.md a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.md strong{font-weight:650}
.md blockquote{margin:0 0 .85em;padding:2px 0 2px 14px;border-left:3px solid var(--line);color:var(--ink-2)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.md code{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.86em;background:var(--code);padding:.12em .38em;border-radius:6px}
.md .table{overflow-x:auto;margin:0 0 .9em;border:1px solid var(--line);border-radius:12px}
.md table{border-collapse:collapse;width:100%;font-size:14px}
.md th,.md td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.md th{font-weight:600;background:var(--rail)}
.md tr:last-child td{border-bottom:0}
.code{margin:0 0 .95em;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--code)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--line)}
.code-head button{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:7px;color:var(--ink-2);font-size:12px}
.code-head button:hover{background:var(--hover);color:var(--ink)}
.code-head svg{width:13px;height:13px}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6}
.code pre code{background:none;padding:0;font-size:inherit;border-radius:0}
.hljs-keyword,.hljs-built_in,.hljs-selector-tag,.hljs-meta .hljs-keyword{color:var(--hl-k)}
.hljs-string,.hljs-regexp,.hljs-template-string,.hljs-addition{color:var(--hl-s)}
.hljs-number,.hljs-literal,.hljs-symbol,.hljs-attr,.hljs-attribute{color:var(--hl-n)}
.hljs-comment,.hljs-quote,.hljs-deletion{color:var(--hl-c);font-style:italic}
.hljs-title,.hljs-type,.hljs-class .hljs-title,.hljs-function .hljs-title,.hljs-tag,.hljs-name,.hljs-section{color:var(--hl-t)}
.tools{margin:0 0 12px;font-size:13.5px;color:var(--ink-2)}
.tools summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;border-radius:8px;color:var(--ink-2)}
.tools summary::-webkit-details-marker{display:none}
.tools summary:hover{background:var(--hover)}
.tools summary svg{width:14px;height:14px;transition:transform .15s}
.tools details[open] summary svg{transform:rotate(90deg)}
.tool-list{margin:4px 0 0 7px;padding-left:14px;border-left:2px solid var(--line)}
.tool{display:flex;align-items:center;gap:8px;padding:3px 0}
.tool i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.2s ease-in-out infinite}
.tool.done i{animation:none;background:var(--ink-3)}
.tool.err i{animation:none;background:var(--danger)}
.tool span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.think{margin:0 0 12px;font-size:13.5px;color:var(--ink-2)}
.think summary,.think .think-head{list-style:none;display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;border-radius:8px;color:var(--ink-2)}
.think summary{cursor:pointer}
.think .think-head{padding-left:8px}
.think summary::-webkit-details-marker{display:none}
.think summary:hover{background:var(--hover)}
.think summary svg{width:14px;height:14px;transition:transform .15s}
.think[open] summary svg{transform:rotate(90deg)}
.think .live{background:linear-gradient(90deg,var(--ink-3) 0%,var(--ink) 45%,var(--ink-3) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.8s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.think-body{margin:6px 0 2px 7px;padding:2px 0 2px 16px;border-left:2px solid var(--line);color:var(--ink-2);font-size:14px;line-height:1.62}
.think-body.md p{margin:0 0 .7em}
.arts{display:flex;flex-direction:column;gap:8px;margin:2px 0 14px}
.art{display:flex;align-items:center;gap:12px;width:100%;max-width:460px;padding:9px 8px 9px 9px;border:1px solid var(--line);border-radius:16px;background:var(--raise);text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.md .art{margin:0 0 .95em}
.art:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 8px 22px -14px rgba(23,32,54,.4)}
.art .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.art .ico svg{width:21px;height:21px}
.art .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.art b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art small{color:var(--ink-3);font-size:12.5px}
.art .dl{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.art .dl:hover{background:var(--hover);color:var(--ink)}
.art .dl svg{width:17px;height:17px}
.art.off{cursor:default;opacity:.75}
.art.off:hover{border-color:var(--line);box-shadow:none}
.art.on{border-color:var(--accent)}
.panel{grid-column:3;display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;height:100dvh;background:var(--raise);border-left:1px solid var(--line)}
.p-head{flex:none;display:flex;align-items:center;gap:6px;height:58px;padding:0 8px 0 16px;border-bottom:1px solid var(--line)}
.p-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.p-title b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title small{color:var(--ink-3);font-size:12px}
.tabs{display:inline-flex;padding:3px;border-radius:11px;background:var(--rail);border:1px solid var(--line);margin-right:4px}
.tabs button{height:28px;padding:0 11px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.tabs button.on{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.p-body{flex:1;min-height:0;overflow:auto;position:relative;background:var(--paper)}
.p-body iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.p-img{display:grid;place-items:center;min-height:100%;padding:24px;background:repeating-conic-gradient(var(--rail) 0 25%,var(--paper) 0 50%) 0 0/22px 22px}
.p-img img{max-width:100%;height:auto;border-radius:6px;box-shadow:var(--shadow)}
.p-doc{max-width:740px;margin:0 auto;padding:26px 30px 48px;font-size:15.5px;line-height:1.66}
.p-code{margin:0;min-height:100%;padding:16px 18px;background:var(--code);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre;tab-size:2}
.p-code code{font-family:inherit}
.p-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;padding:24px;color:var(--ink-3);text-align:center}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:14px;height:26px}
.thinking .wave{display:flex;align-items:flex-end;gap:2px;height:14px}
.thinking .wave i{width:3px;border-radius:2px;background:var(--accent);animation:wave 1s ease-in-out infinite}
.thinking .wave i:nth-child(1){height:5px;animation-delay:0s}.thinking .wave i:nth-child(2){height:8px;animation-delay:.1s}.thinking .wave i:nth-child(3){height:11px;animation-delay:.2s}.thinking .wave i:nth-child(4){height:14px;animation-delay:.3s}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}
.caret::after{content:"";display:inline-block;width:8px;height:1.05em;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--accent);animation:pulse .9s steps(2) infinite}
.note{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5}
.note.err{background:var(--danger-soft);color:var(--danger)}
.note.soft{background:var(--rail);color:var(--ink-2)}

  let j;

  if (S.chatId !== id) return;
  S.chat = j.chat;
  if (j.chat.running) {
    if (!S.live) liveStart(j.partial);
    else if (j.partial) { const L = S.live; L.text = j.partial.text; L.tools = j.partial.tools; L.status = j.partial.status; L.thinking = j.partial.thinking || ""; L.thinkingMs = j.partial.thinkingMs || 0; L.thinkActive = L.status === "Thinking" && !L.text; liveQueue(); }
    S.poll = setTimeout(() => pollChat(id), 1500);
  } else {
    S.live = null;
    renderThread(j.messages);
    autoScroll(true);
    loadChats();
  }
  updateSend();
}
function newChat(push) {
  stopPolling();
  if (S.busy) return toast("Wait for this reply to finish, or stop it first.");
  S.chatId = null;
  S.chat = null;
  S.live = null;
  closePanel();
  $("threadInner").innerHTML = "";
  $("main").classList.add("is-empty");
  document.title = CFG.name;
  renderPickerBtn();
  if (push) history.pushState({}, "", "/");
  renderHistory();
  renderChrome();
  $("input").focus();
}
$("newChat").onclick = () => { newChat(true); $("app").classList.remove("side-open"); };
$("newChatTop").onclick = () => newChat(true);
$("brand").onclick = e => { e.preventDefault(); newChat(true); };
window.addEventListener("popstate", () => {
  const m = location.pathname.match(/^\/c\/([\w-]+)/);
  if (m) openChat(m[1], false);
  else newChat(false);
});

function updateSend() {
  const btn = $("sendBtn");
  if (S.busy || (S.live && S.chat && S.chat.running)) {
    btn.innerHTML = I.stop;
    btn.disabled = !S.busy && !(S.chat && S.chat.running);
    btn.setAttribute("aria-label", "Stop");
    btn.dataset.stop = "1";
    return;
  }
  btn.innerHTML = I.send;
  btn.dataset.stop = "";
  btn.setAttribute("aria-label", "Send");
  const has = $("input").value.trim() || S.files.length;
  btn.disabled = !has;
}
const input = $("input");
function grow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px";
}
input.addEventListener("input", () => { grow(); updateSend(); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(hover: none)").matches) {
    e.preventDefault();
    if (!S.busy) send();
  }
});
$("composer").addEventListener("submit", e => {
  e.preventDefault();
  if ($("sendBtn").dataset.stop === "1") stop();
  else send();
});

function bytesToB64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 32768) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
  return btoa(s);
}
function readFile(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1] || "");
    r.onerror = () => rej(r.error);
    r.readAsDataURL(f);
  });
}
function totalBytes() { return S.files.reduce((a, f) => a + f.size, 0); }
async function addFiles(list) {
  for (const f of list) {
    if (S.files.length >= 25) { toast("You can attach up to 25 files at a time."); break; }
    if (totalBytes() + f.size > MAX_BYTES) { toast("Attachments are limited to 15 MB per message."); break; }
    try {
      const data = await readFile(f);
      S.files.push({ name: f.name || "file", type: f.type || "", size: f.size, data });
    } catch {
      toast(`Couldn't read ${f.name}.`);
    }
  }
  renderChips();
}
function addPasted(text) {
  const bytes = new TextEncoder().encode(text);
  if (totalBytes() + bytes.length > MAX_BYTES) return toast("Attachments are limited to 15 MB per message.");
  S.files.push({ name: `Pasted text ${S.pasteN++}.txt`, type: "text/plain", size: bytes.length, data: bytesToB64(bytes) });
  renderChips();
}
function renderChips() {
  $("chips").innerHTML = S.files.map((f, k) => `<span class="chip">${I.file}<span>${esc(f.name)}</span><small>${fmtSize(f.size)}</small><button type="button" data-rm="${k}" aria-label="Remove ${esc(f.name)}">${I.x}</button></span>`).join("");
  updateSend();
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest("[data-rm]");
  if (!b) return;
  S.files.splice(+b.dataset.rm, 1);
  renderChips();
});
$("attachBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
input.addEventListener("paste", e => {
  const cd = e.clipboardData;
  if (!cd) return;
  const files = [...cd.files];
  if (files.length) { e.preventDefault(); addFiles(files); return; }
  const t = cd.getData("text/plain");
  if (t && t.length > 4000) { e.preventDefault(); addPasted(t); toast("Long paste added as a text file."); }
});
const comp = $("composer");
comp.addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); comp.classList.add("drag"); } });
comp.addEventListener("dragleave", () => comp.classList.remove("drag"));
comp.addEventListener("drop", e => { if (!e.dataTransfer.files.length) return; e.preventDefault(); comp.classList.remove("drag"); addFiles([...e.dataTransfer.files]); });

async function send() {
  const text = input.value.trim();
  if ((!text && !S.files.length) || S.busy) return;
  stopPolling();
  const files = S.files.slice();
  const model = S.model;
  const effort = effortFor(model);
  const startedIn = S.chatId;
  S.busy = true;
  input.value = "";
  grow();
  S.files = [];
  renderChips();
  const userNode = userEl({ content: text, meta: { files: files.map(f => ({ name: f.name, size: f.size })) } });
  $("threadInner").append(userNode);
  liveStart(null);
  S.stick = true;
  autoScroll(true);
  updateSend();
  const restore = msg => {
    userNode.remove();
    if (S.live) { S.live.el.remove(); S.live = null; }
    if (!$("threadInner").children.length) $("main").classList.add("is-empty");
    input.value = text;
    grow();
    S.files = files;
    renderChips();
    if (msg) toast(msg, 6000);
  };
  let res;
  try {
    res = await api("/api/send", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ chatId: S.chatId, text, model, effort, files: files.map(f => ({ name: f.name, type: f.type, data: f.data })) }) });
  } catch (e) {
    S.busy = false;
    restore(e.message === "Signed out" ? "" : e.message);
    updateSend();
    return;
  }
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    S.busy = false;
    restore(j.error || `Something went wrong (${res.status}).`);
    if (j.code === "offline") loadState();
    updateSend();
    return;
  }
  let gotDone = false;
  try {
    const reader = res.body.getReader();
    const td = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += td.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, k);
        buf = buf.slice(k + 1);
        if (!line.trim()) continue;
        let ev;
        try { ev = JSON.parse(line); } catch { continue; }
        if (handleEvent(ev, startedIn)) gotDone = true;
      }
    }
  } catch {}
  S.busy = false;
  if (!gotDone && S.chatId) {
    S.chat = S.chat || { running: true };
    S.poll = setTimeout(() => pollChat(S.chatId), 800);
  }
  updateSend();
  loadChats();
}
function handleEvent(ev, startedIn) {
  const L = S.live;
  switch (ev.type) {
    case "meta":
      S.chatId = ev.chat.id;
      S.chat = { id: ev.chat.id, title: ev.chat.title, running: ev.runId, model: ev.user && ev.user.meta ? ev.user.meta.model : S.model, effort: ev.user && ev.user.meta ? ev.user.meta.effort : effortFor(S.model) };
      renderPickerBtn();
      if (!startedIn) {
        history.pushState({ id: ev.chat.id }, "", `/c/${ev.chat.id}`);
        document.title = ev.chat.title + " · " + CFG.name;
        S.chats = [{ id: ev.chat.id, title: ev.chat.title, updated: Date.now(), running: ev.runId }, ...S.chats.filter(c => c.id !== ev.chat.id)];
        renderHistory();
      }
      return false;
    case "delta":
      if (L) { L.text += ev.text; L.thinkActive = false; liveQueue(); }
      return false;
    case "thinking":
      if (L) { L.thinking += ev.text; L.thinkActive = true; liveQueue(); }
      return false;
    case "thinking_done":
      if (L) { L.thinkingMs = ev.ms || L.thinkingMs; L.thinkActive = false; liveQueue(); }
      return false;
    case "tool":
      if (L) { L.tools.push({ id: ev.id, name: ev.name, label: ev.label, done: false }); L.thinkActive = false; liveQueue(); }
      return false;
    case "tool_done":
      if (L) { const t = L.tools.find(x => x.id === ev.id); if (t) { t.done = true; t.error = ev.error; } liveQueue(); }
      return false;
    case "status":
      if (L) { L.status = ev.text; if (ev.text === "Thinking") L.thinkActive = true; liveQueue(); }
      return false;
    case "done":
      if (S.chat) S.chat.running = null;
      liveFinish(ev.message);
      return true;
    default:
      return false;
  }
}
async function stop() {
  if (!S.chatId) return;
  try { await apiJson("/api/stop", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ chatId: S.chatId }) }); } catch (e) { toast(e.message); }
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.append(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  if (btn) {
    const old = btn.innerHTML;
    btn.innerHTML = btn.querySelector("span") ? `${I.check}<span>Copied</span>` : I.check;
    setTimeout(() => (btn.innerHTML = old), 1400);
  }
}
document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy-code]");
  if (c) { copyText(c.closest(".code").querySelector("code").innerText, c); return; }
  const m = e.target.closest("[data-copy-msg]");
  if (m) { copyText(m.closest(".msg")._raw || "", m); return; }
  if (e.target.closest("[data-dl]")) return;
  const card = e.target.closest("[data-art]");
  if (card && ARTS.get(card.dataset.art)) openPanel(ARTS.get(card.dataset.art));
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest && e.target.closest("[data-art]");
  if (!card || e.target.closest("[data-dl]")) return;
  e.preventDefault();
  if (ARTS.get(card.dataset.art)) openPanel(ARTS.get(card.dataset.art));
});

const LANG = { htm: "html", html: "html", svg: "xml", xml: "xml", md: "markdown", markdown: "markdown", js: "javascript", mjs: "javascript", cjs: "javascript", jsx: "javascript", ts: "typescript", tsx: "typescript", py: "python", rb: "ruby", rs: "rust", kt: "kotlin", cs: "csharp", h: "c", hpp: "cpp", sh: "bash", ps1: "powershell", yml: "yaml", txt: "plaintext", log: "plaintext", csv: "plaintext" };
function textual(a) { return ["web", "code", "doc"].includes(a.kind) || a.mime === "image/svg+xml"; }
async function artText(a) {
  if (P.text.has(a.id)) return P.text.get(a.id);
  const r = await api(`/a/${encodeURIComponent(a.id)}`);
  if (!r.ok) throw new Error("Couldn't load this file.");
  const t = await r.text();
  P.text.set(a.id, t);
  return t;
}
function markCards() {
  document.querySelectorAll(".art[data-art]").forEach(x => x.classList.toggle("on", !!P.a && x.dataset.art === P.a.id));
}
function openPanel(a, tab) {
  if (!a || !a.id) return;
  P.a = a;
  P.tab = tab || (a.kind === "code" ? "code" : "preview");
  $("pName").textContent = a.name;
  $("pSub").textContent = `${KIND[a.kind] || "File"} · ${fmtSize(a.size || 0)}`;
  $("pTabs").hidden = !(a.kind === "web" || a.kind === "doc" || a.mime === "image/svg+xml");
  $("pCopy").hidden = !textual(a);
  $("pCopy").innerHTML = I.copy;
  $("pDownload").href = `/a/${encodeURIComponent(a.id)}?download=1`;
  $("pDownload").setAttribute("download", a.name);
  $("pDownload").innerHTML = I.download;
  $("panel").hidden = false;
  $("app").classList.add("panel-open");
  markCards();
  renderPanelBody();
}
function closePanel() {
  if (!P.a && $("panel").hidden) return;
  P.a = null;
  $("panel").hidden = true;
  $("app").classList.remove("panel-open");
  $("pBody").innerHTML = "";
  markCards();
}
async function renderPanelBody() {
  const a = P.a;
  if (!a) return;
  [...$("pTabs").children].forEach(b => b.classList.toggle("on", b.dataset.tab === P.tab));
  const body = $("pBody");
  const src = `/a/${encodeURIComponent(a.id)}`;
  const loadText = async render => {
    body.innerHTML = '<div class="p-empty">Loading…</div>';
    try {
      const t = await artText(a);
      if (P.a !== a) return;
      body.innerHTML = render(t);
      if (t.length < 400000) highlight(body);
    } catch (e) {
      if (P.a === a) body.innerHTML = `<div class="p-empty">${esc(e.message === "Signed out" ? "Sign in again to see this file." : e.message)}</div>`;
    }
  };
  if (P.tab === "code" || a.kind === "code") {
    const ext = ((a.name.match(/\.([A-Za-z0-9]+)$/) || [])[1] || "").toLowerCase();
    const lang = LANG[ext] || ext || "plaintext";
    return loadText(t => `<pre class="p-code"><code class="language-${esc(lang)}">${esc(t)}</code></pre>`);
  }
  if (a.kind === "doc") return loadText(t => `<div class="md p-doc">${md(t)}</div>`);
  if (a.kind === "web") body.innerHTML = `<iframe src="${src}" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads" title="${esc(a.name)}"></iframe>`;
  else if (a.kind === "pdf") body.innerHTML = `<iframe src="${src}" title="${esc(a.name)}"></iframe>`;
  else if (a.kind === "image") body.innerHTML = `<div class="p-img"><img src="${src}" alt="${esc(a.name)}"></div>`;
  else body.innerHTML = `<div class="p-empty"><span>There's no preview for this kind of file.</span><a class="btn ghost" href="${src}?download=1" download="${esc(a.name)}">${I.download}Download</a></div>`;
}
$("pTabs").onclick = e => {
  const b = e.target.closest("[data-tab]");
  if (!b || !P.a) return;
  P.tab = b.dataset.tab;
  renderPanelBody();
};
$("pClose").onclick = () => closePanel();
$("pCopy").onclick = async () => {
  if (!P.a) return;
  try { copyText(await artText(P.a), $("pCopy")); } catch (e) { toast(e.message); }
};

$("openSide").onclick = e => { e.stopPropagation(); $("app").classList.add("side-open"); };
$("scrim").onclick = () => $("app").classList.remove("side-open");
$("hideSide").onclick = () => {
  if (matchMedia("(max-width: 860px)").matches) $("app").classList.remove("side-open");
  else { $("app").classList.add("side-collapsed"); store.set("collapsed", true); }
};
$("showSide").onclick = () => { $("app").classList.remove("side-collapsed"); store.set("collapsed", false); };
if (store.get("collapsed", false)) $("app").classList.add("side-collapsed");

const darkMq = matchMedia("(prefers-color-scheme: dark)");
function isDark() {
  const t = store.get("theme", "system");
  return t === "dark" || (t !== "light" && darkMq.matches);
}
function applyTheme() {
  const t = store.get("theme", "system");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  const d = isDark();
  $("themeBtn").classList.toggle("dark", d);
  $("themeBtn").setAttribute("aria-checked", String(d));
  $("themeBtn").title = d ? "Switch to light mode" : "Switch to dark mode";
}
$("themeBtn").onclick = () => { store.set("theme", isDark() ? "light" : "dark"); applyTheme(); };
darkMq.addEventListener("change", applyTheme);
applyTheme();
input.placeholder = "Message " + CFG.ai;
document.title = CFG.name;

document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadState(); loadChats(); } });
setInterval(() => { if (!document.hidden) loadState(); }, 20000);

renderPickerBtn();
renderChrome();
(async () => {
  await Promise.all([loadState(), loadChats()]);
  const m = location.pathname.match(/^\/c\/([\w-]+)/);
  if (m) await openChat(m[1], false);
  else input.focus();
  if (document.readyState === "complete") highlight(document);
  else window.addEventListener("load", () => highlight(document));
})();
})();
</script>
